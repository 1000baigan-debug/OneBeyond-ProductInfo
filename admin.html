<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>One Beyond Weekly Price Updates</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .preview-button {
      background: #111;
      color: white;
      width: 100%;
      margin-top: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .stat {
      background: #f1f1f1;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #111;
      color: white;
    }

    .price {
      font-weight: 700;
    }

    .error {
      color: #b00020;
      background: #ffe5e5;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .success {
      color: #155724;
      background: #d4edda;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    @media (max-width: 700px) {

      .columns {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .app {
        padding: 16px;
      }

    }
  </style>
</head>

<body>

<div class="app">

  <h1>ONE BEYOND WEEKLY PRICE UPDATES</h1>

  <div class="subtitle">
    Upload the weekly TXT pricing file and preview the products.
  </div>


  <!-- FILE -->

  <div class="box">

    <h2>1. Upload TXT File</h2>

    <input
      id="fileInput"
      type="file"
      accept=".txt,.csv"
    >

    <div id="fileInfo"></div>

  </div>


  <!-- COLUMNS -->

  <div class="box">

    <h2>2. Check Columns</h2>

    <div class="columns">

      <div>

        <label for="barcodeColumn">
          Barcode Column
        </label>

        <select id="barcodeColumn"></select>

      </div>


      <div>

        <label for="nameColumn">
          Product Name Column
        </label>

        <select id="nameColumn"></select>

      </div>


      <div>

        <label for="priceColumn">
          Price Column
        </label>

        <select id="priceColumn"></select>

      </div>

    </div>


    <button
      class="preview-button"
      onclick="previewPricing()"
    >
      Preview Pricing
    </button>

  </div>


  <!-- RESULTS -->

  <div
    id="results"
    style="display:none;"
  >

    <div class="box">

      <h2>3. Preview Pricing</h2>

      <div class="stats">

        <div class="stat">
          Total Records
          <strong id="totalRecords">0</strong>
        </div>

        <div class="stat">
          Preview Valid
          <strong id="validRecords">0</strong>
        </div>

        <div class="stat">
          Preview Invalid
          <strong id="invalidRecords">0</strong>
        </div>

      </div>


      <div
        id="message"
      ></div>


      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>Barcode</th>
              <th>Product Name</th>
              <th>Price</th>
            </tr>

          </thead>

          <tbody id="previewBody"></tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<script>

  let fileText = "";
  let rows = [];
  let headers = [];


  /* =========================
     FILE UPLOAD
     ========================= */

  document
    .getElementById("fileInput")
    .addEventListener("change", function(event) {

      const file = event.target.files[0];

      if (!file) {
        return;
      }


      const reader = new FileReader();


      reader.onload = function(e) {

        fileText = e.target.result;

        parseFile();

      };


      reader.onerror = function() {

        alert(
          "Unable to read the file."
        );

      };


      reader.readAsText(file);

    });


  /* =========================
     CLEAN FIELD
     ========================= */

  function cleanField(value) {

    if (value === undefined || value === null) {
      return "";
    }


    let text = String(value).trim();


    /*
      Remove surrounding quotation marks.
    */

    if (
      text.length >= 2 &&
      (
        (text.startsWith('"') && text.endsWith('"')) ||
        (text.startsWith("'") && text.endsWith("'"))
      )
    ) {

      text = text.substring(
        1,
        text.length - 1
      );

    }


    return text.trim();

  }


  /* =========================
     PRICE CLEANING
     ========================= */

  function cleanPrice(value) {

    let text = cleanField(value);


    /*
      Remove pound signs.
    */

    text = text.replace(/£/g, "");


    /*
      Remove spaces.
    */

    text = text.replace(/\s/g, "");


    /*
      Handle common decimal formats.
    */

    if (
      text.includes(",") &&
      text.includes(".")
    ) {

      /*
        Example:
        1,234.50
      */

      text = text.replace(/,/g, "");

    } else if (
      text.includes(",")
    ) {

      /*
        Example:
        2,50
      */

      text = text.replace(",", ".");

    }


    /*
      Keep only numbers and decimal point.
    */

    text = text.replace(
      /[^0-9.-]/g,
      ""
    );


    const number =
      Number.parseFloat(text);


    if (!Number.isFinite(number)) {
      return null;
    }


    return number;

  }


  /* =========================
     DETECT DELIMITER
     ========================= */

  function detectDelimiter(line) {

    const delimiters = [
      "\t",
      "|",
      ",",
      ";"
    ];


    let bestDelimiter = "\t";
    let bestCount = 0;


    for (
      const delimiter of delimiters
    ) {

      const count =
        line.split(delimiter).length - 1;


      if (count > bestCount) {

        bestCount = count;
        bestDelimiter = delimiter;

      }

    }


    return bestDelimiter;

  }


  /* =========================
     PARSE LINE
     ========================= */

  function parseLine(
    line,
    delimiter
  ) {

    const result = [];
    let current = "";
    let insideQuotes = false;


    for (
      let i = 0;
      i < line.length;
      i++
    ) {

      const char = line[i];


      if (char === '"') {

        if (
          insideQuotes &&
          line[i + 1] === '"'
        ) {

          current += '"';
          i++;

        } else {

          insideQuotes =
            !insideQuotes;

        }

      } else if (
        char === delimiter &&
        !insideQuotes
      ) {

        result.push(
          cleanField(current)
        );

        current = "";

      } else {

        current += char;

      }

    }


    result.push(
      cleanField(current)
    );


    return result;

  }


  /* =========================
     PARSE FILE
     ========================= */

  function parseFile() {

    const lines =
      fileText
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n")
        .filter(line => line.trim() !== "");


    if (lines.length === 0) {

      alert(
        "The file appears to be empty."
      );

      return;

    }


    const delimiter =
      detectDelimiter(lines[0]);


    headers =
      parseLine(
        lines[0],
        delimiter
      );


    rows = [];


    for (
      let i = 1;
      i < lines.length;
      i++
    ) {

      const row =
        parseLine(
          lines[i],
          delimiter
        );


      if (row.length > 0) {

        rows.push(row);

      }

    }


    populateColumnSelectors();


    document.getElementById(
      "fileInfo"
    ).innerHTML = `
      <div class="success">
        File loaded successfully.
        ${rows.length.toLocaleString()}
        records detected.
      </div>
    `;

  }


  /* =========================
     COLUMN SELECTORS
     ========================= */

  function populateColumnSelectors() {

    const selects = [
      document.getElementById(
        "barcodeColumn"
      ),

      document.getElementById(
        "nameColumn"
      ),

      document.getElementById(
        "priceColumn"
      )
    ];


    selects.forEach(select => {

      select.innerHTML = "";


      headers.forEach(
        (header, index) => {

          const option =
            document.createElement(
              "option"
            );


          option.value = index;

          option.textContent =
            header ||
            `Column ${index + 1}`;


          select.appendChild(
            option
          );

        }
      );

    });


    /*
      Automatically detect likely columns.
    */

    const findColumn = names => {

      return headers.findIndex(
        header =>
          names.includes(
            cleanField(
              header
            ).toLowerCase()
          )
      );

    };


    const barcodeIndex =
      findColumn([
        "barcode",
        "ean",
        "ean13",
        "upc"
      ]);


    const nameIndex =
      findColumn([
        "description",
        "product name",
        "name",
        "product"
      ]);


    const priceIndex =
      findColumn([
        "price",
        "selling price",
        "sell price",
        "retail price"
      ]);


    if (barcodeIndex >= 0) {

      document.getElementById(
        "barcodeColumn"
      ).value =
        barcodeIndex;

    }


    if (nameIndex >= 0) {

      document.getElementById(
        "nameColumn"
      ).value =
        nameIndex;

    }


    if (priceIndex >= 0) {

      document.getElementById(
        "priceColumn"
      ).value =
        priceIndex;

    }

  }


  /* =========================
     PREVIEW
     ========================= */

  function previewPricing() {

    if (
      !rows.length ||
      !headers.length
    ) {

      alert(
        "Please choose a pricing file first."
      );

      return;

    }


    const barcodeIndex =
      Number(
        document.getElementById(
          "barcodeColumn"
        ).value
      );


    const nameIndex =
      Number(
        document.getElementById(
          "nameColumn"
        ).value
      );


    const priceIndex =
      Number(
        document.getElementById(
          "priceColumn"
        ).value
      );


    let valid = 0;
    let invalid = 0;


    const previewRows = [];


    /*
      Only inspect the first 20 rows
      for the preview.
    */

    rows.slice(0, 20).forEach(row => {

      const barcode =
        cleanField(
          row[barcodeIndex]
        );


      const name =
        cleanField(
          row[nameIndex]
        );


      const price =
        cleanPrice(
          row[priceIndex]
        );


      if (
        barcode &&
        name &&
        price !== null
      ) {

        valid++;

      } else {

        invalid++;

      }


      previewRows.push({
        barcode,
        name,
        price
      });

    });


    document.getElementById(
      "totalRecords"
    ).textContent =
      rows.length.toLocaleString();


    document.getElementById(
      "validRecords"
    ).textContent =
      valid;


    document.getElementById(
      "invalidRecords"
    ).textContent =
      invalid;


    const body =
      document.getElementById(
        "previewBody"
      );


    body.innerHTML = "";


    previewRows.forEach(item => {

      const tr =
        document.createElement(
          "tr"
        );


      const barcodeCell =
        document.createElement(
          "td"
        );


      barcodeCell.textContent =
        item.barcode;


      const nameCell =
        document.createElement(
          "td"
        );


      nameCell.textContent =
        item.name;


      const priceCell =
        document.createElement(
          "td"
        );


      if (item.price === null) {

        priceCell.textContent =
          "INVALID";

      } else {

        priceCell.textContent =
          "£" +
          item.price.toFixed(2);

      }


      priceCell.className =
        "price";


      tr.appendChild(
        barcodeCell
      );

      tr.appendChild(
        nameCell
      );

      tr.appendChild(
        priceCell
      );


      body.appendChild(
        tr
      );

    });


    document.getElementById(
      "results"
    ).style.display =
      "block";


    document.getElementById(
      "message"
    ).innerHTML = `
      <div class="success">
        Preview generated successfully.
        Showing the first 20 records.
      </div>
    `;

  }

</script>

</body>
</html>
