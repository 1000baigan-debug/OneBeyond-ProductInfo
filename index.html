<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One Beyond Price Checker</title>

  <meta name="theme-color" content="#0057b8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    button,
    input {
      font-family: inherit;
    }

    .header {
      background: #0057b8;
      color: white;
      padding: 18px 16px;
      text-align: center;
      font-weight: 700;
      font-size: 21px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .home-title {
      text-align: center;
      margin: 12px 0 22px;
    }

    .home-title h1 {
      margin: 0 0 7px;
      font-size: 26px;
    }

    .home-title p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .menu-button {
      width: 100%;
      min-height: 72px;
      border: 0;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 17px;
      font-weight: 700;
      color: #111827;
      cursor: pointer;
      text-align: left;
      padding: 18px;
    }

    .menu-button:active {
      transform: scale(0.99);
    }

    .menu-button.primary {
      background: #0057b8;
      color: white;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin: 5px 0 18px;
    }

    .back-button {
      border: 0;
      background: transparent;
      color: #0057b8;
      font-size: 15px;
      font-weight: 700;
      padding: 4px 0 16px;
      cursor: pointer;
    }

    .search-box {
      background: white;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 0 14px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #0057b8;
    }

    .action-button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 9px;
      background: #0057b8;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .scanner-status {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0 15px;
    }

    .result-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.08);
    }

    .product-name {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 16px;
    }

    .price-label {
      color: #6b7280;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .current-price {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .product-info {
      border-top: 1px solid #e5e7eb;
      padding-top: 14px;
    }

    .info-row {
      margin-bottom: 12px;
    }

    .info-label {
      font-size: 12px;
      color: #6b7280;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 15px;
      word-break: break-word;
    }

    .promo-header {
      margin-top: 20px;
      margin-bottom: 12px;
      padding-bottom: 9px;
      border-bottom: 2px solid #0057b8;
      color: #0057b8;
      font-size: 18px;
      font-weight: 800;
    }

    .promo-entry {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 11px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .promo-entry-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #111827;
    }

    .promo-row {
      margin-bottom: 9px;
    }

    .promo-row:last-child {
      margin-bottom: 0;
    }

    .promo-row-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .promo-row-value {
      font-size: 14px;
      line-height: 1.35;
    }

    .no-promo {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      color: #6b7280;
      font-size: 14px;
    }

    .promo-type-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .promo-type-name {
      font-size: 17px;
      font-weight: 700;
    }

    .promo-type-count {
      background: #e8f1fb;
      color: #0057b8;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .location-card {
      background: white;
      border-radius: 12px;
      padding: 17px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .location-name {
      font-size: 17px;
      font-weight: 800;
    }

    .location-count {
      background: #0057b8;
      color: white;
      min-width: 30px;
      height: 27px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 800;
    }

    .product-list-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .product-number {
      font-size: 12px;
      color: #0057b8;
      font-weight: 800;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .list-product-name {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .list-price {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .small-info {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .small-info strong {
      color: #111827;
    }

    .empty-state {
      background: white;
      border-radius: 12px;
      padding: 25px 18px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .loading {
      text-align: center;
      padding: 30px 10px;
      color: #6b7280;
      font-size: 14px;
    }

    .error-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #9f1239;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      margin-top: 12px;
    }

    .success-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      margin-top: 12px;
    }

    .count-summary {
      color: #6b7280;
      font-size: 13px;
      margin: -7px 0 14px;
    }

    @media (min-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    One Beyond Price Checker
  </div>

  <div class="container">

    <!-- HOME -->
    <section id="homeScreen" class="screen active">

      <div class="home-title">
        <h1>Price Checker</h1>
        <p>Select an option below</p>
      </div>

      <div class="menu-grid">

        <button class="menu-button primary" onclick="openScanner()">
          Scan Barcode
        </button>

        <button class="menu-button" onclick="openProductSearch()">
          Search Product Code
        </button>

        <button class="menu-button" onclick="openPromotions()">
          Promotions
        </button>

      </div>

    </section>


    <!-- SCANNER -->
    <section id="scannerScreen" class="screen">

      <button class="back-button" onclick="goHome()">
        ← Back
      </button>

      <div class="section-title">
        Scan Barcode
      </div>

      <div id="reader"></div>

      <div id="scannerStatus" class="scanner-status">
        Point the camera at a product barcode.
      </div>

      <div id="scannerResult"></div>

    </section>


    <!-- PRODUCT CODE SEARCH -->
    <section id="searchScreen" class="screen">

      <button class="back-button" onclick="goHome()">
        ← Back
      </button>

      <div class="section-title">
        Search Product Code
      </div>

      <div class="search-box">

        <input
          id="productCodeInput"
          type="text"
          placeholder="Enter product code"
          autocomplete="off"
        >

        <button class="action-button" onclick="searchProductCode()">
          Search
        </button>

      </div>

      <div id="searchResult"></div>

    </section>


    <!-- PROMOTION TYPES -->
    <section id="promotionsScreen" class="screen">

      <button class="back-button" onclick="goHome()">
        ← Back
      </button>

      <div class="section-title">
        Promotions
      </div>

      <div id="promotionTypes">
        <div class="loading">
          Loading promotional information...
        </div>
      </div>

    </section>


    <!-- PROMOTION LOCATIONS -->
    <section id="promotionLocationsScreen" class="screen">

      <button class="back-button" onclick="openPromotions()">
        ← Back to Promotions
      </button>

      <div id="locationTitle" class="section-title">
        Promotional Locations
      </div>

      <div id="promotionLocations"></div>

    </section>


    <!-- PROMOTION PRODUCTS -->
    <section id="promotionProductsScreen" class="screen">

      <button class="back-button" onclick="backToLocations()">
        ← Back to Locations
      </button>

      <div id="productsTitle" class="section-title">
        Products
      </div>

      <div id="productsSummary" class="count-summary"></div>

      <div id="promotionProducts"></div>

    </section>

  </div>


<script>

  /* ============================================================
     SUPABASE
  ============================================================ */

  const SUPABASE_URL = "https://nmfjavzrxghvklkjtfaq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ============================================================
     GLOBAL VARIABLES
  ============================================================ */

  let scanner = null;

  let allPromoProducts = [];

  let promotionStructure = {};

  let selectedPromotionType = null;

  let selectedLocation = null;

  let promoDataLoaded = false;


  /* ============================================================
     SCREEN MANAGEMENT
  ============================================================ */

  function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
      screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    window.scrollTo({
      top: 0,
      behavior: "instant"
    });
  }


  function goHome() {

    stopScanner();

    showScreen("homeScreen");

  }


  /* ============================================================
     BARCODE SCANNER
  ============================================================ */

  async function openScanner() {

    stopScanner();

    showScreen("scannerScreen");

    document.getElementById("scannerResult").innerHTML = "";

    document.getElementById("scannerStatus").textContent =
      "Starting camera...";

    scanner = new Html5Qrcode("reader");

    try {

      await scanner.start(
        {
          facingMode: "environment"
        },
        {
          fps: 10,
          qrbox: {
            width: 280,
            height: 150
          }
        },
        async (decodedText) => {

          await handleBarcode(decodedText);

        },
        () => {}
      );

      document.getElementById("scannerStatus").textContent =
        "Point the camera at a product barcode.";

    } catch (error) {

      document.getElementById("scannerStatus").innerHTML =
        `<div class="error-box">
          Unable to start the camera. Please check camera permission.
        </div>`;

    }

  }


  async function stopScanner() {

    if (!scanner) {
      return;
    }

    try {

      if (scanner.isScanning) {
        await scanner.stop();
      }

      scanner.clear();

    } catch (error) {
      // Ignore scanner stop errors
    }

    scanner = null;

  }


  /* ============================================================
     BARCODE LOOKUP
  ============================================================ */

  async function handleBarcode(barcode) {

    const cleanBarcode = String(barcode).trim();

    if (!cleanBarcode) {
      return;
    }

    document.getElementById("scannerStatus").textContent =
      "Checking product...";

    try {

      const { data, error } =
        await supabaseClient
          .from("products")
          .select(`
            barcode,
            name,
            price,
            product_code,
            promo_offer
          `)
          .eq("barcode", cleanBarcode)
          .order("product_code", {
            ascending: true
          });

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {

        document.getElementById("scannerResult").innerHTML =
          `
          <div class="empty-state">
            No product found for barcode
            <br><br>
            <strong>${escapeHtml(cleanBarcode)}</strong>
          </div>
          `;

        document.getElementById("scannerStatus").textContent =
          "Scan another product.";

        return;
      }

      document.getElementById("scannerResult").innerHTML =
        data.map(product => buildProductResult(product)).join("");

      document.getElementById("scannerStatus").textContent =
        "Product found.";

    } catch (error) {

      document.getElementById("scannerResult").innerHTML =
        `
        <div class="error-box">
          Unable to check this product.
          <br><br>
          ${escapeHtml(error.message || "Unknown error")}
        </div>
        `;

      document.getElementById("scannerStatus").textContent =
        "Please try again.";

    }

  }


  /* ============================================================
     PRODUCT CODE SEARCH
  ============================================================ */

  function openProductSearch() {

    stopScanner();

    showScreen("searchScreen");

    document.getElementById("productCodeInput").focus();

  }


  async function searchProductCode() {

    const input =
      document.getElementById("productCodeInput");

    const code = input.value.trim();

    const result =
      document.getElementById("searchResult");

    if (!code) {

      result.innerHTML =
        `
        <div class="error-box">
          Please enter a product code.
        </div>
        `;

      return;
    }

    result.innerHTML =
      `<div class="loading">Searching...</div>`;

    try {

      const { data, error } =
        await supabaseClient
          .from("products")
          .select(`
            barcode,
            name,
            price,
            product_code,
            promo_offer
          `)
          .eq("product_code", code)
          .order("barcode", {
            ascending: true
          });

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {

        result.innerHTML =
          `
          <div class="empty-state">
            No product found for product code
            <br><br>
            <strong>${escapeHtml(code)}</strong>
          </div>
          `;

        return;
      }

      result.innerHTML =
        data.map(product => buildProductResult(product)).join("");

    } catch (error) {

      result.innerHTML =
        `
        <div class="error-box">
          Unable to search.
          <br><br>
          ${escapeHtml(error.message || "Unknown error")}
        </div>
        `;

    }

  }


  document
    .getElementById("productCodeInput")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        searchProductCode();
      }

    });


  /* ============================================================
     PRODUCT RESULT
  ============================================================ */

  function buildProductResult(product) {

    const promoEntries =
      parsePromoOffer(product.promo_offer);

    let html = `
      <div class="result-card">

        <div class="product-name">
          ${escapeHtml(product.name || "Unnamed product")}
        </div>

        <div class="price-label">
          Current Price
        </div>

        <div class="current-price">
          ${formatPrice(product.price)}
        </div>

        <div class="product-info">

          <div class="info-row">
            <div class="info-label">
              Barcode
            </div>
            <div class="info-value">
              ${escapeHtml(product.barcode || "-")}
            </div>
          </div>

          <div class="info-row">
            <div class="info-label">
              Product Code
            </div>
            <div class="info-value">
              ${escapeHtml(product.product_code || "-")}
            </div>
          </div>

        </div>
    `;


    if (promoEntries.length > 0) {

      html += `
        <div class="promo-header">
          Promotional Information
        </div>
      `;

      promoEntries.forEach((entry, index) => {

        html += buildPromoEntryDisplay(
          entry,
          index
        );

      });

    } else {

      html += `
        <div class="promo-header">
          Promotional Information
        </div>

        <div class="no-promo">
          No promotional information recorded for this product.
        </div>
      `;

    }


    html += `
      </div>
    `;

    return html;

  }


  /* ============================================================
     PROMOTION PARSER
  ============================================================ */

  function parsePromoOffer(text) {

    if (!text) {
      return [];
    }

    const raw = String(text)
      .replace(/\r/g, "")
      .trim();

    if (!raw) {
      return [];
    }


    /*
      The admin page stores promotional records beginning with:

      PLAN:
      LOCATION:
      STORE CATEGORIES:
      CODE:
      PRODUCT:
      PROMO PRICE:
      DETAILS:

      Split each PLAN record into its own promotion.
    */

    let chunks = raw
      .split(/(?=\n?\s*PLAN\s*:)/i)
      .map(x => x.trim())
      .filter(Boolean);


    /*
      If there was only one record but it does not start with PLAN,
      treat the entire text as one record.
    */

    if (chunks.length === 0) {
      chunks = [raw];
    }


    const entries = [];

    chunks.forEach(chunk => {

      const entry = {

        plan: getLabelValue(
          chunk,
          ["PLAN"]
        ),

        location: getLabelValue(
          chunk,
          [
            "LOCATION",
            "PLACEMENT"
          ]
        ),

        type: getLabelValue(
          chunk,
          ["TYPE"]
        ),

        storeCategories: getLabelValue(
          chunk,
          [
            "STORE CATEGORIES",
            "CATEGORIES"
          ]
        ),

        code: getLabelValue(
          chunk,
          [
            "CODE",
            "PRODUCT CODE"
          ]
        ),

        barcode: getLabelValue(
          chunk,
          ["BARCODE"]
        ),

        product: getLabelValue(
          chunk,
          [
            "PRODUCT",
            "DESCRIPTION"
          ]
        ),

        promoPrice: getLabelValue(
          chunk,
          [
            "PROMO PRICE",
            "PROMOTIONAL PRICE",
            "PRICE"
          ]
        ),

        offer: getLabelValue(
          chunk,
          ["OFFER"]
        ),

        bay: getLabelValue(
          chunk,
          [
            "BAY",
            "BAY NO",
            "BAY NUMBER"
          ]
        ),

        shelf: getLabelValue(
          chunk,
          [
            "SHELF",
            "SHARED SHELF"
          ]
        ),

        comments: getLabelValue(
          chunk,
          [
            "COMMENTS",
            "DETAILS"
          ]
        ),

        instructions: getLabelValue(
          chunk,
          ["INSTRUCTIONS"]
        ),

        supplierFunded: getLabelValue(
          chunk,
          ["SUPPLIER FUNDED"]
        )

      };


      /*
        If the product field wasn't explicitly stored,
        don't replace it with unrelated information.
      */

      entry.location =
        cleanValue(entry.location);

      entry.plan =
        cleanValue(entry.plan);

      entry.type =
        cleanValue(entry.type);

      entry.storeCategories =
        cleanValue(entry.storeCategories);

      entry.code =
        cleanValue(entry.code);

      entry.product =
        cleanValue(entry.product);

      entry.promoPrice =
        cleanValue(entry.promoPrice);

      entry.offer =
        cleanValue(entry.offer);

      entry.bay =
        cleanValue(entry.bay);

      entry.shelf =
        cleanValue(entry.shelf);

      entry.comments =
        cleanValue(entry.comments);

      entry.instructions =
        cleanValue(entry.instructions);

      entry.supplierFunded =
        cleanValue(entry.supplierFunded);


      entry.promotionType =
        identifyPromotionType(entry);


      entry.locationName =
        identifyLocation(entry);


      /*
        Only add meaningful promotional records.
      */

      if (
        entry.plan ||
        entry.location ||
        entry.type ||
        entry.bay ||
        entry.product ||
        entry.code
      ) {

        entries.push(entry);

      }

    });


    return entries;

  }


  /* ============================================================
     LABEL READER
  ============================================================ */

  function getLabelValue(text, labels) {

    for (const label of labels) {

      const escaped =
        label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      const regex =
        new RegExp(
          "(?:^|\\n)\\s*" +
          escaped +
          "\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*[A-Z][A-Z0-9 _/&-]*\\s*:|$)",
          "i"
        );

      const match =
        text.match(regex);

      if (match && match[1]) {

        return cleanValue(match[1]);

      }

    }

    return "";

  }


  function cleanValue(value) {

    if (!value) {
      return "";
    }

    return String(value)
      .replace(/\r/g, "")
      .trim()
      .replace(/\n{3,}/g, "\n\n");

  }


  /* ============================================================
     PROMOTION TYPE
  ============================================================ */

  function identifyPromotionType(entry) {

    const plan =
      String(entry.plan || "").toUpperCase();

    const location =
      String(entry.location || "").toUpperCase();

    const type =
      String(entry.type || "").toUpperCase();


    const combined =
      `${plan} ${location} ${type}`;


    /*
      IMPORTANT:
      Check the more specific sections first.

      TILL ENDS must be checked before generic ENDS.
      PROMO BAY PLASTIC TRAYS and PROMO BAY CLIP STRIPS
      must be checked before generic PROMO BAYS.
    */


    if (
      combined.includes("PROMO BAY PLASTIC TRAY") ||
      combined.includes("PROMO BAY PLASTIC TRAYS")
    ) {
      return "PROMO BAY PLASTIC TRAYS";
    }


    if (
      combined.includes("PROMO BAY CLIP STRIP") ||
      combined.includes("PROMO BAY CLIP STRIPS")
    ) {
      return "PROMO BAY CLIP STRIPS";
    }


    if (
      combined.includes("TILL FRONT") ||
      combined.includes("TILL FRONTS")
    ) {
      return "TILL FRONTS";
    }


    if (
      combined.includes("TILL END") ||
      combined.includes("TILL ENDS")
    ) {
      return "TILL ENDS";
    }


    if (
      combined.includes("END GONDOLA")
    ) {
      return "ENDS";
    }


    if (
      /^\s*END\s*\d+/i.test(entry.location || "") ||
      /\bEND\s*\d+/i.test(location)
    ) {
      return "ENDS";
    }


    if (
      combined.includes("SIDE GONDOLA")
    ) {
      return "SIDES";
    }


    if (
      /^\s*SIDE\s*\d+/i.test(entry.location || "") ||
      /\bSIDE\s*\d+/i.test(location)
    ) {
      return "SIDES";
    }


    if (
      combined.includes("PROMO BAY")
    ) {
      return "PROMO BAYS";
    }


    if (
      /\bBAY\s*\d+/i.test(location)
    ) {
      return "PROMO BAYS";
    }


    if (
      combined.includes("FRONT OF STORE")
    ) {
      return "FRONT OF STORE";
    }


    if (
      combined.includes("WINDOW BASKET")
    ) {
      return "WINDOW BASKETS";
    }


    if (
      combined.includes("BULK STACK")
    ) {
      return "BULK STACKS";
    }


    if (
      combined.includes("PENCIL STACK")
    ) {
      return "PENCIL STACKS";
    }


    if (
      combined.includes("FSDU") ||
      combined.includes("STAND")
    ) {
      return "FSDU & STANDS";
    }


    if (
      combined.includes("DUMP BIN")
    ) {
      return "DUMP BINS";
    }


    if (
      combined.includes("GIANT TIERED") ||
      combined.includes("REAR HALF")
    ) {
      return "GIANT TIERED BASKETS";
    }


    if (
      combined.includes("CLIP STRIP")
    ) {
      return "CLIP STRIPS";
    }


    if (
      combined.includes("DRINKS CHILLER") ||
      combined.includes("DRINK CHILLER")
    ) {
      return "DRINKS CHILLER";
    }


    return "OTHER";

  }


  /* ============================================================
     LOCATION IDENTIFICATION
  ============================================================ */

  function identifyLocation(entry) {

    let location =
      cleanValue(entry.location);

    const bay =
      cleanValue(entry.bay);


    /*
      If the PDF/admin data already contains a location,
      preserve it exactly where possible.
    */

    if (location) {

      return normaliseLocationName(
        location,
        entry.promotionType
      );

    }


    /*
      If there is a BAY field, use it for Promo Bays.
    */

    if (bay) {

      const match =
        bay.match(/(?:PROMO\s*)?BAY\s*([0-9]+)/i);

      if (match) {

        return `BAY ${match[1]}`;

      }

      return bay;

    }


    return "GENERAL";

  }


  function normaliseLocationName(
    location,
    promotionType
  ) {

    let value =
      String(location)
        .replace(/\s+/g, " ")
        .trim();


    /*
      END
      END 1
      END1
      END - 1

      becomes:

      END 1
    */

    if (promotionType === "ENDS") {

      const match =
        value.match(
          /(?:END|ENDS)\s*[-#:]*\s*(\d+)/i
        );

      if (match) {
        return `END ${match[1]}`;
      }

    }


    /*
      SIDE
      SIDE 1
      SIDE1
      SIDE - 1
    */

    if (promotionType === "SIDES") {

      const match =
        value.match(
          /(?:SIDE|SIDES)\s*[-#:]*\s*(\d+)/i
        );

      if (match) {
        return `SIDE ${match[1]}`;
      }

    }


    /*
      PROMO BAY
      BAY
      BAY 1
      PROMO BAY 1

      becomes:

      BAY 1
    */

    if (
      promotionType === "PROMO BAYS" ||
      promotionType === "PROMO BAY PLASTIC TRAYS" ||
      promotionType === "PROMO BAY CLIP STRIPS"
    ) {

      const match =
        value.match(
          /(?:PROMO\s*)?BAY\s*[-#:]*\s*(\d+)/i
        );

      if (match) {
        return `BAY ${match[1]}`;
      }

    }


    /*
      TILL END
      TILL END 1
    */

    if (promotionType === "TILL ENDS") {

      const match =
        value.match(
          /TILL\s*END\s*[-#:]*\s*(\d+)/i
        );

      if (match) {
        return `TILL END ${match[1]}`;
      }

    }


    /*
      TILL FRONT
      TILL FRONT 1
    */

    if (promotionType === "TILL FRONTS") {

      const match =
        value.match(
          /TILL\s*FRONT\s*[-#:]*\s*(\d+)/i
        );

      if (match) {
        return `TILL FRONT ${match[1]}`;
      }

    }


    return value;

  }


  /* ============================================================
     PROMOTIONS
  ============================================================ */

  async function openPromotions() {

    stopScanner();

    showScreen("promotionsScreen");

    if (!promoDataLoaded) {

      await loadPromotionData();

    }

    renderPromotionTypes();

  }


  async function loadPromotionData() {

    const container =
      document.getElementById("promotionTypes");

    container.innerHTML =
      `<div class="loading">
        Loading promotional information...
      </div>`;


    allPromoProducts = [];


    try {

      /*
        Supabase returns a limited number of rows per request,
        so load the promotional products in batches.
      */

      const pageSize = 1000;

      let from = 0;

      while (true) {

        const to =
          from + pageSize - 1;


        const { data, error } =
          await supabaseClient
            .from("products")
            .select(`
              barcode,
              name,
              price,
              product_code,
              promo_offer
            `)
            .not("promo_offer", "is", null)
            .neq("promo_offer", "")
            .range(from, to);


        if (error) {
          throw error;
        }


        if (!data || data.length === 0) {
          break;
        }


        allPromoProducts =
          allPromoProducts.concat(data);


        if (data.length < pageSize) {
          break;
        }


        from += pageSize;

      }


      /*
        Build the complete promotion structure.
      */

      promotionStructure = {};


      allPromoProducts.forEach(product => {

        const entries =
          parsePromoOffer(product.promo_offer);


        entries.forEach(entry => {

          if (!entry.promotionType) {
            return;
          }


          if (
            !promotionStructure[
              entry.promotionType
            ]
          ) {

            promotionStructure[
              entry.promotionType
            ] = {};

          }


          const location =
            entry.locationName ||
            "GENERAL";


          if (
            !promotionStructure[
              entry.promotionType
            ][location]
          ) {

            promotionStructure[
              entry.promotionType
            ][location] = [];

          }


          /*
            Store the product together with its
            specific promotional entry.
          */

          promotionStructure[
            entry.promotionType
          ][location].push({

            product: product,

            entry: entry

          });

        });

      });


      promoDataLoaded = true;

    } catch (error) {

      container.innerHTML =
        `
        <div class="error-box">
          Unable to load promotional information.
          <br><br>
          ${escapeHtml(
            error.message || "Unknown error"
          )}
        </div>
        `;

    }

  }


  /* ============================================================
     PROMOTION TYPE LIST
  ============================================================ */

  function renderPromotionTypes() {

    const container =
      document.getElementById("promotionTypes");


    const preferredOrder = [

      "ENDS",
      "SIDES",
      "TILL ENDS",
      "TILL FRONTS",
      "FRONT OF STORE",
      "WINDOW BASKETS",
      "PROMO BAYS",
      "PROMO BAY PLASTIC TRAYS",
      "PROMO BAY CLIP STRIPS",
      "BULK STACKS",
      "PENCIL STACKS",
      "FSDU & STANDS",
      "DUMP BINS",
      "GIANT TIERED BASKETS",
      "CLIP STRIPS",
      "DRINKS CHILLER",
      "OTHER"

    ];


    const availableTypes =
      Object.keys(promotionStructure);


    const orderedTypes = [];


    preferredOrder.forEach(type => {

      if (
        availableTypes.includes(type)
      ) {

        orderedTypes.push(type);

      }

    });


    /*
      Add anything not covered by the
      standard order.
    */

    availableTypes.forEach(type => {

      if (!orderedTypes.includes(type)) {
        orderedTypes.push(type);
      }

    });


    if (orderedTypes.length === 0) {

      container.innerHTML =
        `
        <div class="empty-state">
          No promotional information is currently available.
        </div>
        `;

      return;

    }


    container.innerHTML =
      orderedTypes.map(type => {

        const locations =
          promotionStructure[type] || {};


        const locationCount =
          Object.keys(locations).length;


        const productCount =
          Object.values(locations)
            .reduce(
              (total, products) =>
                total + products.length,
              0
            );


        return `
          <div
            class="promo-type-card"
            onclick="openPromotionLocations('${escapeAttribute(type)}')"
          >

            <div>

              <div class="promo-type-name">
                ${escapeHtml(type)}
              </div>

              <div
                style="
                  margin-top:5px;
                  color:#6b7280;
                  font-size:13px;
                "
              >
                ${locationCount}
                ${locationCount === 1 ? "location" : "locations"}
              </div>

            </div>

            <div class="promo-type-count">
              ${productCount} products
            </div>

          </div>
        `;

      }).join("");

  }


  /* ============================================================
     PROMOTION LOCATIONS
  ============================================================ */

  function openPromotionLocations(type) {

    selectedPromotionType = type;

    selectedLocation = null;

    showScreen(
      "promotionLocationsScreen"
    );


    document.getElementById("locationTitle")
      .textContent = type;


    const container =
      document.getElementById(
        "promotionLocations"
      );


    const locations =
      promotionStructure[type] || {};


    const locationNames =
      Object.keys(locations);


    if (locationNames.length === 0) {

      container.innerHTML =
        `
        <div class="empty-state">
          No locations found for
          <strong>${escapeHtml(type)}</strong>.
        </div>
        `;

      return;

    }


    /*
      Sort locations naturally.

      END 1
      END 2
      END 10

      rather than:

      END 1
      END 10
      END 2
    */

    locationNames.sort(
      naturalLocationSort
    );


    container.innerHTML =
      locationNames.map(location => {

        const count =
          locations[location].length;


        return `
          <div
            class="location-card"
            onclick="
              openPromotionProducts(
                '${escapeAttribute(location)}'
              )
            "
          >

            <div class="location-name">
              ${escapeHtml(location)}
            </div>

            <div class="location-count">
              ${count}
            </div>

          </div>
        `;

      }).join("");

  }


  /* ============================================================
     PROMOTION PRODUCTS
  ============================================================ */

  function openPromotionProducts(location) {

    selectedLocation = location;

    showScreen(
      "promotionProductsScreen"
    );


    document.getElementById("productsTitle")
      .textContent =
        `${selectedPromotionType} — ${location}`;


    const products =
      (
        promotionStructure[
          selectedPromotionType
        ] || {}
      )[location] || [];


    document.getElementById("productsSummary")
      .textContent =
        `${products.length} ${
          products.length === 1
            ? "product"
            : "products"
        }`;


    const container =
      document.getElementById(
        "promotionProducts"
      );


    if (products.length === 0) {

      container.innerHTML =
        `
        <div class="empty-state">
          No products found for
          <strong>${escapeHtml(location)}</strong>.
        </div>
        `;

      return;

    }


    container.innerHTML =
      products.map(
        (item, index) => {

          return buildPromotionProductCard(
            item,
            index
          );

        }
      ).join("");

  }


  function backToLocations() {

    openPromotionLocations(
      selectedPromotionType
    );

  }


  /* ============================================================
     PROMOTION PRODUCT CARD
  ============================================================ */

  function buildPromotionProductCard(
    item,
    index
  ) {

    const product =
      item.product;

    const entry =
      item.entry;


    let html = `
      <div class="product-list-card">

        <div class="product-number">
          Product ${index + 1}
        </div>

        <div class="list-product-name">
          ${escapeHtml(
            product.name || "Unnamed product"
          )}
        </div>

        <div class="list-price">
          ${formatPrice(product.price)}
        </div>

        <div class="small-info">
          <strong>Barcode:</strong>
          ${escapeHtml(
            product.barcode || "-"
          )}
        </div>

        <div class="small-info">
          <strong>Product Code:</strong>
          ${escapeHtml(
            product.product_code || "-"
          )}
        </div>
    `;


    if (entry.storeCategories) {

      html += `
        <div class="small-info">
          <strong>Store Categories:</strong>
          ${escapeHtml(
            entry.storeCategories
          )}
        </div>
      `;

    }


    if (entry.promoPrice) {

      html += `
        <div class="small-info">
          <strong>Promotional Price:</strong>
          ${escapeHtml(
            entry.promoPrice
          )}
        </div>
      `;

    }


    if (entry.offer) {

      html += `
        <div class="small-info">
          <strong>Offer:</strong>
          ${escapeHtml(
            entry.offer
          )}
        </div>
      `;

    }


    if (
      entry.bay &&
      !entry.locationName.includes(
        entry.bay
      )
    ) {

      html += `
        <div class="small-info">
          <strong>Bay:</strong>
          ${escapeHtml(
            entry.bay
          )}
        </div>
      `;

    }


    if (entry.shelf) {

      html += `
        <div class="small-info">
          <strong>Shelf:</strong>
          ${escapeHtml(
            entry.shelf
          )}
        </div>
      `;

    }


    if (entry.supplierFunded) {

      html += `
        <div class="small-info">
          <strong>Supplier Funded:</strong>
          ${escapeHtml(
            entry.supplierFunded
          )}
        </div>
      `;

    }


    if (entry.comments) {

      html += `
        <div class="small-info">
          <strong>Comments:</strong>
          ${escapeHtml(
            entry.comments
          )}
        </div>
      `;

    }


    html += `
      </div>
    `;


    return html;

  }


  /* ============================================================
     PROMOTIONAL ENTRY DISPLAY
  ============================================================ */

  function buildPromoEntryDisplay(
    entry,
    index
  ) {

    let title = "";


    if (entry.locationName) {

      title =
        entry.locationName;

    } else if (entry.plan) {

      title =
        entry.plan;

    } else {

      title =
        `Promotion ${index + 1}`;

    }


    let html = `
      <div class="promo-entry">

        <div class="promo-entry-title">
          ${escapeHtml(title)}
        </div>
    `;


    if (
      entry.location &&
      entry.location !== entry.locationName
    ) {

      html += promoRow(
        "Placement",
        entry.location
      );

    }


    if (entry.storeCategories) {

      html += promoRow(
        "Store Categories",
        entry.storeCategories
      );

    }


    if (entry.code) {

      html += promoRow(
        "Product Code",
        entry.code
      );

    }


    if (entry.barcode) {

      html += promoRow(
        "Barcode",
        entry.barcode
      );

    }


    if (entry.product) {

      html += promoRow(
        "Product",
        entry.product
      );

    }


    if (entry.promoPrice) {

      html += promoRow(
        "Promotional Price",
        entry.promoPrice
      );

    }


    if (entry.offer) {

      html += promoRow(
        "Offer",
        entry.offer
      );

    }


    if (entry.bay) {

      html += promoRow(
        "Bay",
        entry.bay
      );

    }


    if (entry.shelf) {

      html += promoRow(
        "Shelf",
        entry.shelf
      );

    }


    if (entry.supplierFunded) {

      html += promoRow(
        "Supplier Funded",
        entry.supplierFunded
      );

    }


    if (entry.comments) {

      html += promoRow(
        "Comments",
        entry.comments
      );

    }


    if (entry.instructions) {

      html += promoRow(
        "Instructions",
        entry.instructions
      );

    }


    html += `
      </div>
    `;


    return html;

  }


  function promoRow(
    label,
    value
  ) {

    return `
      <div class="promo-row">

        <div class="promo-row-label">
          ${escapeHtml(label)}
        </div>

        <div class="promo-row-value">
          ${escapeHtml(value)}
        </div>

      </div>
    `;

  }


  /* ============================================================
     NATURAL SORTING
  ============================================================ */

  function naturalLocationSort(a, b) {

    const aMatch =
      String(a).match(/(\d+)/);

    const bMatch =
      String(b).match(/(\d+)/);


    if (aMatch && bMatch) {

      const aNumber =
        Number(aMatch[1]);

      const bNumber =
        Number(bMatch[1]);


      if (aNumber !== bNumber) {

        return aNumber - bNumber;

      }

    }


    return String(a)
      .localeCompare(
        String(b),
        undefined,
        {
          numeric: true,
          sensitivity: "base"
        }
      );

  }


  /* ============================================================
     PRICE FORMAT
  ============================================================ */

  function formatPrice(price) {

    if (
      price === null ||
      price === undefined ||
      price === ""
    ) {

      return "—";

    }


    const number =
      Number(price);


    if (Number.isNaN(number)) {

      return escapeHtml(
        String(price)
      );

    }


    return `£${number.toFixed(2)}`;

  }


  /* ============================================================
     SECURITY / HTML ESCAPING
  ============================================================ */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  /* ============================================================
     START
  ============================================================ */

  console.log(
    "One Beyond Price Checker loaded."
  );

</script>
