<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>One Beyond Price Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      background: #111;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }

    main {
      padding: 24px 20px;
    }

    .scan-button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 22px;
      font-size: 20px;
      font-weight: 700;
      background: #ffd500;
      color: #111;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .manual {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
    }

    .search {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      background: #111;
      color: white;
    }

    .result {
      margin-top: 25px;
      padding: 24px;
      border-radius: 16px;
      background: #f1f1f1;
      text-align: center;
    }

    .result h2 {
      margin: 0 0 10px;
    }

    .price {
      font-size: 52px;
      font-weight: 800;
      margin-top: 15px;
    }

    .not-found {
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: #ffe5e5;
      text-align: center;
    }

    #scanner {
      display: none;
      margin-top: 20px;
    }

    #reader {
      width: 100%;
    }

    .close {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>ONE BEYOND</h1>
    <p>Barcode Price Checker</p>
  </header>

  <main>

    <button class="scan-button" onclick="startScanner()">
      📷 Scan Barcode
    </button>

    <div class="manual">
      <input
        id="barcodeInput"
        type="text"
        inputmode="numeric"
        placeholder="Enter barcode"
      >

      <button class="search" onclick="searchBarcode()">
        Search
      </button>
    </div>

    <div id="scanner">
      <div id="reader"></div>
      <button class="close" onclick="stopScanner()">
        Close Scanner
      </button>
    </div>

    <div id="result"></div>

  </main>

</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

  /*
    Temporary pricing database.

    We will replace this with your real TXT pricing database
    in the next stages.
  */

  const SUPABASE_URL = "https://nmfjavzrxghvklkjtfaq.supabase.co/rest/v1/";
const SUPABASE_KEY = "HIDDEN_KEY";

  const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  let scanner = null;

  async function searchBarcode(code) {

  code = String(code).trim();

  const result = document.getElementById("result");

  if (!code) {
    result.innerHTML = "";
    return;
  }

  result.innerHTML = `
    <div class="result">
      <h2>Checking price...</h2>
    </div>
  `;

  const { data, error } = await supabase
    .from("products")
    .select("barcode, name, price")
    .eq("barcode", code)
    .maybeSingle();

  if (error) {

    console.error(error);

    result.innerHTML = `
      <div class="not-found">
        <h2>Database error</h2>
        <p>Please try again.</p>
      </div>
    `;

    return;
  }

  if (data) {

    result.innerHTML = `
      <div class="result">
        <h2>${escapeHtml(data.name)}</h2>
        <div>Barcode: ${escapeHtml(data.barcode)}</div>
        <div class="price">£${escapeHtml(data.price)}</div>
      </div>
    `;

  } else {

    result.innerHTML = `
      <div class="not-found">
        <h2>Product not found</h2>
        <p>Barcode: ${escapeHtml(code)}</p>
      </div>
    `;

  }
}

    const product = products[code];

    if (product) {

      result.innerHTML = `
        <div class="result">
          <h2>${product.name}</h2>
          <div>Barcode: ${code}</div>
          <div class="price">${product.price}</div>
        </div>
      `;

    } else {

      result.innerHTML = `
        <div class="not-found">
          <h2>Product not found</h2>
          <p>Barcode: ${code}</p>
        </div>
      `;

    }
  }

  async function searchBarcode(code) {

  code = String(code).trim();

  const result = document.getElementById("result");

  if (!code) {
    result.innerHTML = "";
    return;
  }

  result.innerHTML = `
    <div class="result">
      <h2>Checking price...</h2>
    </div>
  `;

  try {

    const { data, error } = await supabase
      .from("products")
      .select("barcode, name, price")
      .eq("barcode", code)
      .maybeSingle();

    if (error) {
      console.error(error);

      result.innerHTML = `
        <div class="not-found">
          <h2>Database error</h2>
          <p>Please try again.</p>
        </div>
      `;

      return;
    }

    if (data) {

      result.innerHTML = `
        <div class="result">
          <h2>${escapeHtml(data.name)}</h2>
          <div>Barcode: ${escapeHtml(data.barcode)}</div>
          <div class="price">£${escapeHtml(data.price)}</div>
        </div>
      `;

    } else {

      result.innerHTML = `
        <div class="not-found">
          <h2>Product not found</h2>
          <p>Barcode: ${escapeHtml(code)}</p>
        </div>
      `;

    }

  } catch (error) {

    console.error(error);

    result.innerHTML = `
      <div class="not-found">
        <h2>Something went wrong</h2>
        <p>Please try again.</p>
      </div>
    `;

  }
}

    const code = document.getElementById("barcodeInput").value;

    searchBarcode(code);
  }

  function startScanner() {

    document.getElementById("scanner").style.display = "block";

    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 150
        }
      },
      (decodedText) => {

        document.getElementById("barcodeInput").value = decodedText;

        searchBarcode(decodedText);

        stopScanner();

      },
      () => {}
    ).catch(error => {

      alert("Unable to access the camera. Please allow camera access.");

    });

  }

  function stopScanner() {

    if (scanner) {

      scanner.stop()
        .then(() => {
          scanner.clear();
        })
        .catch(() => {});

      scanner = null;
    }

    document.getElementById("scanner").style.display = "none";
  }

</script>

</body>
</html>
