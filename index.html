<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One Beyond Price Checker</title>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #111;
    }

    .header {
      background: #0057b8;
      color: white;
      padding: 22px 18px;
      text-align: center;
      border-bottom: 7px solid #ffd500;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #0057b8;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #d5d5d5;
      border-radius: 10px;
      font-size: 17px;
      outline: none;
    }

    input:focus {
      border-color: #0057b8;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .search-button {
      background: #ffd500;
      color: #111;
    }

    .scan-button {
      background: #0057b8;
      color: white;
    }

    .stop-button {
      background: #222;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    .result {
      display: none;
    }

    .product-name {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #0057b8;
    }

    .price-box {
      background: #ffd500;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 16px;
    }

    .price-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .price {
      font-size: 38px;
      font-weight: 900;
      margin-top: 3px;
    }

    .promo-box {
      background: #0057b8;
      color: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .promo-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .promo {
      font-size: 20px;
      font-weight: 800;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e5e5;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #666;
      font-weight: 600;
    }

    .info-value {
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-top: 12px;
      font-weight: 700;
      text-align: center;
    }

    .error {
      background: #ffe2e2;
      color: #a00000;
    }

    .success {
      background: #e4f7e4;
      color: #176b17;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      padding: 10px 20px 25px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>ONE BEYOND</h1>
    <p>Price Checker</p>
  </div>

  <div class="container">

    <div class="card">

      <div class="section-title">Search by barcode</div>

      <input
        id="barcodeInput"
        type="text"
        inputmode="numeric"
        placeholder="Enter barcode"
      >

      <button
        class="search-button"
        onclick="searchBarcode()"
      >
        Search Product
      </button>

      <button
        class="scan-button"
        onclick="startScanner()"
      >
        Scan Barcode
      </button>

      <button
        id="stopButton"
        class="stop-button"
        onclick="stopScanner()"
        style="display:none;"
      >
        Stop Scanner
      </button>

      <div id="reader"></div>

      <div id="message" class="message"></div>

    </div>


    <div id="result" class="card result">

      <div id="productName" class="product-name"></div>

      <div class="price-box">
        <div class="price-label">Current Price</div>
        <div id="productPrice" class="price"></div>
      </div>

      <div id="promoBox" class="promo-box" style="display:none;">
        <div class="promo-label">Promo Offer</div>
        <div id="productPromo" class="promo"></div>
      </div>

      <div class="info-row">
        <div class="info-label">Barcode</div>
        <div id="productBarcode" class="info-value"></div>
      </div>

      <div class="info-row">
        <div class="info-label">Product Code</div>
        <div id="productCode" class="info-value"></div>
      </div>

    </div>

  </div>

  <div class="footer">
    One Beyond Price Checker
  </div>


  <script>

    const SUPABASE_URL =
      "https://nmfjavzrxghvklkjtfaq.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;

      message.style.display = "block";
    }


    function hideMessage() {

      document.getElementById("message")
        .style.display = "none";
    }


    async function lookupBarcode(code) {

      code = String(code).trim();

      if (!code) {

        showMessage(
          "Please enter a barcode.",
          "error"
        );

        return;
      }

      hideMessage();

      const result =
        document.getElementById("result");

      result.style.display = "none";


      const { data, error } =
        await supabaseClient
          .from("products")
          .select(
            "barcode, name, product_code, price, promo_offer"
          )
          .eq("barcode", code)
          .maybeSingle();


      if (error) {

        console.error(error);

        showMessage(
          "There was a problem checking the price.",
          "error"
        );

        return;
      }


      if (!data) {

        showMessage(
          "Product not found.",
          "error"
        );

        return;
      }


      document.getElementById("productName")
        .textContent =
        data.name || "Product";


      document.getElementById("productBarcode")
        .textContent =
        data.barcode || "-";


      document.getElementById("productCode")
        .textContent =
        data.product_code || "-";


      const price =
        Number(data.price);


      document.getElementById("productPrice")
        .textContent =
        Number.isFinite(price)
          ? "£" + price.toFixed(2)
          : "Price unavailable";


      const promoBox =
        document.getElementById("promoBox");

      const promo =
        document.getElementById("productPromo");


      if (
        data.promo_offer !== null &&
        data.promo_offer !== undefined &&
        String(data.promo_offer).trim() !== ""
      ) {

        promo.textContent =
          data.promo_offer;

        promoBox.style.display = "block";

      } else {

        promo.textContent = "";

        promoBox.style.display = "none";
      }


      result.style.display = "block";

      showMessage(
        "Product found.",
        "success"
      );
    }


    async function searchBarcode() {

      const input =
        document.getElementById("barcodeInput");

      const code =
        input.value.trim();

      await lookupBarcode(code);
    }


    let html5QrCode = null;


    async function startScanner() {

      hideMessage();

      const reader =
        document.getElementById("reader");

      reader.innerHTML = "";


      html5QrCode =
        new Html5Qrcode("reader");


      document.getElementById("stopButton")
        .style.display = "block";


      try {

        await html5QrCode.start(

          { facingMode: "environment" },

          {
            fps: 10,
            qrbox: {
              width: 280,
              height: 150
            }
          },

          async (decodedText) => {

            document.getElementById("barcodeInput")
              .value = decodedText;

            await stopScanner();

            await lookupBarcode(decodedText);

          },

          (errorMessage) => {

            // Scanner is still looking.
          }

        );

      } catch (error) {

        console.error(error);

        showMessage(
          "Could not start the camera. Please allow camera access.",
          "error"
        );

        document.getElementById("stopButton")
          .style.display = "none";
      }
    }


    async function stopScanner() {

      if (html5QrCode) {

        try {

          await html5QrCode.stop();

        } catch (error) {

          console.log(error);

        }

        try {

          html5QrCode.clear();

        } catch (error) {

          console.log(error);

        }

        html5QrCode = null;
      }


      document.getElementById("reader")
        .innerHTML = "";

      document.getElementById("stopButton")
        .style.display = "none";
    }


    document.getElementById("barcodeInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          searchBarcode();

        }

      });

  </script>

</body>
</html>
