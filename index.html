<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>One Beyond Price Checker</title>

  <meta name="theme-color" content="#2b5db8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f2f4;
      color: #222;
    }

    button,
    input {
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      background: #2b5db8;
      color: white;
      text-align: center;
      padding: 34px 15px 34px;
      border-bottom: 10px solid #f8d43f;
    }

    .header-title {
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .header-subtitle {
      font-size: 25px;
      margin-top: 14px;
      font-weight: 400;
    }

    /* =====================================================
       APP
    ===================================================== */

    .app {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 22px 18px 50px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* =====================================================
       HOME / FIND PRODUCT
    ===================================================== */

    .main-card {
      background: white;
      border-radius: 25px;
      padding: 34px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .main-heading {
      color: #2b5db8;
      font-size: 34px;
      font-weight: 800;
      margin: 0 0 26px;
    }

    .main-description {
      font-size: 23px;
      color: #666;
      margin-bottom: 30px;
      line-height: 1.35;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 25px;
    }

    .mode-button {
      height: 70px;
      border-radius: 18px;
      border: 4px solid #d6d6d6;
      background: white;
      color: #555;
      font-size: 23px;
      font-weight: 800;
      cursor: pointer;
    }

    .mode-button.active {
      background: #2b5db8;
      border-color: #2b5db8;
      color: white;
    }

    .input-box {
      width: 100%;
      height: 90px;
      border: 4px solid #2b5db8;
      border-radius: 18px;
      background: white;
      padding: 0 25px;
      font-size: 28px;
      outline: none;
      margin-bottom: 18px;
    }

    .input-box::placeholder {
      color: #aaa;
    }

    .yellow-button {
      width: 100%;
      height: 85px;
      border: none;
      border-radius: 18px;
      background: #f8d43f;
      color: #111;
      font-size: 27px;
      font-weight: 900;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .blue-button {
      width: 100%;
      height: 85px;
      border: none;
      border-radius: 18px;
      background: #2b5db8;
      color: white;
      font-size: 27px;
      font-weight: 900;
      cursor: pointer;
    }

    .footer-text {
      text-align: center;
      color: #777;
      font-size: 20px;
      margin: 55px 0 10px;
    }

    /* =====================================================
       PAGE HEADER
    ===================================================== */

    .page-top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }

    .back-button {
      border: none;
      background: transparent;
      color: #2b5db8;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px;
    }

    .page-title {
      color: #2b5db8;
      font-size: 28px;
      font-weight: 800;
      margin: 0;
    }

    /* =====================================================
       SCANNER
    ===================================================== */

    .scanner-card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    #reader {
      width: 100%;
      border-radius: 15px;
      overflow: hidden;
      background: #000;
    }

    .scanner-message {
      text-align: center;
      color: #666;
      padding: 15px 5px 5px;
      font-size: 15px;
    }

    /* =====================================================
       PRODUCT RESULT
    ===================================================== */

    .result-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-top: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .product-name {
      color: #2b5db8;
      font-size: 25px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 22px;
    }

    .price-label {
      font-size: 13px;
      color: #777;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .price {
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .product-detail {
      border-top: 1px solid #ddd;
      padding-top: 14px;
      margin-top: 10px;
    }

    .detail-row {
      margin-bottom: 13px;
    }

    .detail-label {
      color: #777;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .detail-value {
      font-size: 16px;
      word-break: break-word;
    }

    /* =====================================================
       PROMOTION INFORMATION
    ===================================================== */

    .promo-title {
      color: #2b5db8;
      font-size: 21px;
      font-weight: 900;
      border-bottom: 3px solid #2b5db8;
      padding-bottom: 10px;
      margin-top: 25px;
      margin-bottom: 14px;
    }

    .promo-entry {
      background: #f7f9fc;
      border: 1px solid #dce2ea;
      border-radius: 15px;
      padding: 17px;
      margin-bottom: 12px;
    }

    .promo-entry-title {
      color: #222;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .promo-line {
      margin-bottom: 10px;
    }

    .promo-line:last-child {
      margin-bottom: 0;
    }

    .promo-line-label {
      color: #777;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .promo-line-value {
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-line;
    }

    /* =====================================================
       PROMOTIONS
    ===================================================== */

    .promo-intro {
      color: #666;
      font-size: 15px;
      margin-bottom: 17px;
    }

    .promo-section {
      background: white;
      border-radius: 16px;
      min-height: 76px;
      margin-bottom: 11px;
      padding: 17px 18px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      cursor: pointer;
    }

    .promo-section:active,
    .location-card:active,
    .promo-product:active {
      transform: scale(0.99);
    }

    .promo-section-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: #eaf0fb;
      color: #2b5db8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      margin-right: 14px;
    }

    .promo-section-text {
      flex: 1;
    }

    .promo-section-name {
      font-size: 17px;
      font-weight: 900;
    }

    .promo-section-sub {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .promo-count {
      background: #eaf0fb;
      color: #2b5db8;
      padding: 7px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 900;
    }

    /* =====================================================
       LOCATIONS
    ===================================================== */

    .location-card {
      background: white;
      border-radius: 16px;
      min-height: 76px;
      margin-bottom: 11px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
      cursor: pointer;
    }

    .location-number {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: #2b5db8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      margin-right: 14px;
    }

    .location-content {
      flex: 1;
    }

    .location-name {
      font-size: 18px;
      font-weight: 900;
    }

    .location-sub {
      color: #777;
      font-size: 12px;
      margin-top: 3px;
    }

    .location-arrow {
      color: #2b5db8;
      font-size: 27px;
    }

    /* =====================================================
       PROMO PRODUCTS
    ===================================================== */

    .product-summary {
      color: #777;
      font-size: 14px;
      margin: -8px 0 15px;
    }

    .promo-product {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 11px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .product-number {
      color: #2b5db8;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .promo-product-name {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .promo-product-price {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    .small-row {
      color: #555;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 5px;
    }

    .small-row strong {
      color: #222;
    }

    /* =====================================================
       LOADING / ERROR
    ===================================================== */

    .loading {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      color: #777;
    }

    .empty {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      color: #777;
    }

    .error {
      background: #fff0f2;
      border: 1px solid #ffcbd2;
      color: #9f1239;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {

      .header {
        padding: 28px 12px 28px;
      }

      .header-title {
        font-size: 35px;
      }

      .header-subtitle {
        font-size: 22px;
      }

      .app {
        padding: 18px 14px 40px;
      }

      .main-card {
        padding: 25px 20px;
        border-radius: 22px;
      }

      .main-heading {
        font-size: 31px;
      }

      .main-description {
        font-size: 20px;
      }

      .mode-button {
        font-size: 19px;
      }

      .input-box {
        font-size: 22px;
      }

      .yellow-button,
      .blue-button {
        font-size: 23px;
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="header-title">
      ONE BEYOND
    </div>

    <div class="header-subtitle">
      Price Checker
    </div>

  </header>


  <main class="app">


    <!-- ===================================================
         HOME
    ==================================================== -->

    <section
      id="homeScreen"
      class="screen active"
    >

      <div class="main-card">

        <h1 class="main-heading">
          Find a Product
        </h1>

        <div class="main-description">
          Search using a product barcode or product code.
        </div>


        <div class="mode-buttons">

          <button
            id="barcodeModeButton"
            class="mode-button active"
            onclick="setSearchMode('barcode')"
          >
            Barcode
          </button>

          <button
            id="productCodeModeButton"
            class="mode-button"
            onclick="setSearchMode('productcode')"
          >
            Product Code
          </button>

        </div>


        <input
          id="searchInput"
          class="input-box"
          type="text"
          placeholder="Enter barcode"
          autocomplete="off"
        >


        <button
          class="yellow-button"
          onclick="performSearch()"
        >
          Search Product
        </button>


        <button
          class="blue-button"
          onclick="openScanner()"
        >
          Scan Barcode
        </button>

      </div>


      <div class="footer-text">
        One Beyond Price Checker
      </div>


      <div style="margin-top:20px">

        <button
          class="blue-button"
          style="height:65px;font-size:20px"
          onclick="openPromotions()"
        >
          Promotions
        </button>

      </div>

    </section>


    <!-- ===================================================
         SCANNER
    ==================================================== -->

    <section
      id="scannerScreen"
      class="screen"
    >

      <div class="page-top">

        <button
          class="back-button"
          onclick="goHome()"
        >
          ← Back
        </button>

        <h2 class="page-title">
          Scan Barcode
        </h2>

      </div>


      <div class="scanner-card">

        <div id="reader"></div>

        <div
          id="scannerMessage"
          class="scanner-message"
        >
          Starting camera...
        </div>

      </div>


      <div id="scannerResult"></div>

    </section>


    <!-- ===================================================
         SEARCH RESULT
    ==================================================== -->

    <section
      id="searchResultScreen"
      class="screen"
    >

      <div class="page-top">

        <button
          class="back-button"
          onclick="goHome()"
        >
          ← Back
        </button>

        <h2 class="page-title">
          Product
        </h2>

      </div>


      <div id="searchResult"></div>

    </section>


    <!-- ===================================================
         PROMOTIONS
    ==================================================== -->

    <section
      id="promotionsScreen"
      class="screen"
    >

      <div class="page-top">

        <button
          class="back-button"
          onclick="goHome()"
        >
          ← Back
        </button>

        <h2 class="page-title">
          Promotions
        </h2>

      </div>


      <div class="promo-intro">
        Select a promotional area to view its locations.
      </div>


      <div id="promotionTypes">

        <div class="loading">
          Loading promotions...
        </div>

      </div>

    </section>


    <!-- ===================================================
         PROMOTION LOCATIONS
    ==================================================== -->

    <section
      id="locationsScreen"
      class="screen"
    >

      <div class="page-top">

        <button
          class="back-button"
          onclick="openPromotions()"
        >
          ← Back
        </button>

        <h2
          id="locationsTitle"
          class="page-title"
        >
          Locations
        </h2>

      </div>


      <div id="locationsList"></div>

    </section>


    <!-- ===================================================
         PROMOTION PRODUCTS
    ==================================================== -->

    <section
      id="promoProductsScreen"
      class="screen"
    >

      <div class="page-top">

        <button
          class="back-button"
          onclick="backToLocations()"
        >
          ← Back
        </button>

        <h2
          id="promoProductsTitle"
          class="page-title"
        >
          Products
        </h2>

      </div>


      <div
        id="promoProductsSummary"
        class="product-summary"
      ></div>


      <div id="promoProductsList"></div>

    </section>


  </main>


<script>

  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL =
    "https://nmfjavzrxghvklkjtfaq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     VARIABLES
  ========================================================= */

  let searchMode = "barcode";

  let scanner = null;

  let promotionsLoaded = false;

  let promotionalProducts = [];

  let promotionGroups = {};

  let selectedPromotionType = "";

  let selectedLocation = "";


  /* =========================================================
     SCREEN
  ========================================================= */

  function showScreen(id) {

    document
      .querySelectorAll(".screen")
      .forEach(screen => {
        screen.classList.remove("active");
      });

    const screen =
      document.getElementById(id);

    if (screen) {
      screen.classList.add("active");
    }

    window.scrollTo(0, 0);

  }


  function goHome() {

    stopScanner();

    showScreen("homeScreen");

  }


  /* =========================================================
     SEARCH MODE
  ========================================================= */

  function setSearchMode(mode) {

    searchMode = mode;


    const barcodeButton =
      document.getElementById(
        "barcodeModeButton"
      );

    const productCodeButton =
      document.getElementById(
        "productCodeModeButton"
      );

    const input =
      document.getElementById(
        "searchInput"
      );


    if (mode === "barcode") {

      barcodeButton.classList.add("active");

      productCodeButton.classList.remove("active");

      input.placeholder =
        "Enter barcode";

    } else {

      barcodeButton.classList.remove("active");

      productCodeButton.classList.add("active");

      input.placeholder =
        "Enter product code";

    }


    input.value = "";

    input.focus();

  }


  /* =========================================================
     SEARCH
  ========================================================= */

  async function performSearch() {

    const input =
      document.getElementById(
        "searchInput"
      );

    const value =
      input.value.trim();


    if (!value) {

      alert(
        searchMode === "barcode"
          ? "Please enter a barcode."
          : "Please enter a product code."
      );

      return;

    }


    showScreen("searchResultScreen");


    document.getElementById(
      "searchResult"
    ).innerHTML =
      `
      <div class="loading">
        Searching...
      </div>
      `;


    try {

      let query =
        supabaseClient
          .from("products")
          .select(
            "barcode,name,price,product_code,promo_offer"
          );


      if (
        searchMode === "barcode"
      ) {

        query =
          query.eq(
            "barcode",
            value
          );

      } else {

        query =
          query.eq(
            "product_code",
            value
          );

      }


      const {
        data,
        error
      } =
        await query
          .order(
            "product_code",
            {
              ascending: true
            }
          );


      if (error) {
        throw error;
      }


      if (
        !data ||
        data.length === 0
      ) {

        document.getElementById(
          "searchResult"
        ).innerHTML =
          `
          <div class="empty">

            No product found.

            <br><br>

            <strong>
              ${escapeHtml(value)}
            </strong>

          </div>
          `;

        return;

      }


      document.getElementById(
        "searchResult"
      ).innerHTML =
        data
          .map(
            product =>
              buildProductResult(product)
          )
          .join("");


    } catch (error) {

      document.getElementById(
        "searchResult"
      ).innerHTML =
        `
        <div class="error">

          Unable to search for the product.

          <br><br>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </div>
        `;

    }

  }


  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          performSearch();

        }

      }
    );


  /* =========================================================
     SCANNER
  ========================================================= */

  async function openScanner() {

    stopScanner();

    showScreen(
      "scannerScreen"
    );


    document.getElementById(
      "scannerResult"
    ).innerHTML = "";


    document.getElementById(
      "scannerMessage"
    ).textContent =
      "Starting camera...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    try {

      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 150
          }

        },

        async decodedText => {

          await scannerLookup(
            decodedText
          );

        },

        () => {}

      );


      document.getElementById(
        "scannerMessage"
      ).textContent =
        "Point the camera at a product barcode.";

    } catch (error) {

      document.getElementById(
        "scannerMessage"
      ).innerHTML =
        `
        <div class="error">
          Camera could not be started.
          Please allow camera access and try again.
        </div>
        `;

    }

  }


  async function stopScanner() {

    if (!scanner) {
      return;
    }


    try {

      if (
        scanner.isScanning
      ) {

        await scanner.stop();

      }

      scanner.clear();

    } catch (error) {
      // Ignore scanner stop errors.
    }


    scanner = null;

  }


  async function scannerLookup(
    barcode
  ) {

    const value =
      String(barcode).trim();


    if (!value) {
      return;
    }


    document.getElementById(
      "scannerMessage"
    ).textContent =
      "Checking product...";


    try {

      /*
        IMPORTANT:
        Do not use maybeSingle().
        Your pricing data contains a duplicate
        barcode with different product codes.
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("products")
          .select(
            "barcode,name,price,product_code,promo_offer"
          )
          .eq(
            "barcode",
            value
          )
          .order(
            "product_code",
            {
              ascending: true
            }
          );


      if (error) {
        throw error;
      }


      if (
        !data ||
        data.length === 0
      ) {

        document.getElementById(
          "scannerResult"
        ).innerHTML =
          `
          <div class="empty">

            No product found for:

            <br><br>

            <strong>
              ${escapeHtml(value)}
            </strong>

          </div>
          `;

        return;

      }


      document.getElementById(
        "scannerResult"
      ).innerHTML =
        data
          .map(
            product =>
              buildProductResult(product)
          )
          .join("");


      document.getElementById(
        "scannerMessage"
      ).textContent =
        "Product found.";

    } catch (error) {

      document.getElementById(
        "scannerResult"
      ).innerHTML =
        `
        <div class="error">

          Unable to check this product.

          <br><br>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </div>
        `;

    }

  }


  /* =========================================================
     PRODUCT RESULT
  ========================================================= */

  function buildProductResult(
    product
  ) {

    const entries =
      parsePromoOffer(
        product.promo_offer
      );


    let html = `

      <div class="result-card">

        <div class="product-name">
          ${escapeHtml(
            product.name ||
            "Unnamed product"
          )}
        </div>


        <div class="price-label">
          Current Price
        </div>


        <div class="price">
          ${formatPrice(
            product.price
          )}
        </div>


        <div class="product-detail">

          <div class="detail-row">

            <div class="detail-label">
              Barcode
            </div>

            <div class="detail-value">
              ${escapeHtml(
                product.barcode ||
                "-"
              )}
            </div>

          </div>


          <div class="detail-row">

            <div class="detail-label">
              Product Code
            </div>

            <div class="detail-value">
              ${escapeHtml(
                product.product_code ||
                "-"
              )}
            </div>

          </div>

        </div>


        <div class="promo-title">
          Promotional Information
        </div>

    `;


    if (
      entries.length === 0
    ) {

      html += `

        <div class="empty">

          No promotional information recorded
          for this product.

        </div>

      `;

    } else {

      entries.forEach(
        (entry, index) => {

          html +=
            buildPromoEntry(
              entry,
              index
            );

        }
      );

    }


    html += `
      </div>
    `;


    return html;

  }


  /* =========================================================
     PROMOTION PARSER
     
     IMPORTANT:
     This parser is deliberately more flexible.

     It reads the actual LOCATION from the stored
     promotional information and also searches the
     complete record for END / SIDE / BAY numbers.

     This prevents everything falling into GENERAL.
  ========================================================= */

  function parsePromoOffer(
    text
  ) {

    if (!text) {
      return [];
    }


    const raw =
      String(text)
        .replace(/\r/g, "")
        .trim();


    if (!raw) {
      return [];
    }


    let records = [];


    /*
      Current admin format:

      PLAN: ...
      LOCATION: ...
      ...

      PLAN: ...
      LOCATION: ...
      ...

      Split at every PLAN line.
    */

    const planParts =
      raw
        .split(
          /(?=\n?\s*PLAN\s*:)/i
        )
        .map(
          x => x.trim()
        )
        .filter(Boolean);


    if (
      planParts.length > 0
    ) {

      records =
        planParts;

    } else {

      records = [raw];

    }


    /*
      If the data has no PLAN field at all,
      still treat it as one record.
    */

    if (
      records.length === 0
    ) {

      records = [raw];

    }


    const result = [];


    records.forEach(
      record => {

        const entry = {

          raw: record,

          plan:
            getField(
              record,
              [
                "PLAN"
              ]
            ),

          location:
            getField(
              record,
              [
                "LOCATION",
                "PLACEMENT"
              ]
            ),

          type:
            getField(
              record,
              [
                "TYPE"
              ]
            ),

          categories:
            getField(
              record,
              [
                "STORE CATEGORIES",
                "CATEGORIES"
              ]
            ),

          code:
            getField(
              record,
              [
                "CODE",
                "PRODUCT CODE"
              ]
            ),

          barcode:
            getField(
              record,
              [
                "BARCODE"
              ]
            ),

          product:
            getField(
              record,
              [
                "PRODUCT",
                "DESCRIPTION"
              ]
            ),

          promoPrice:
            getField(
              record,
              [
                "PROMO PRICE",
                "PROMOTIONAL PRICE"
              ]
            ),

          price:
            getField(
              record,
              [
                "PRICE"
              ]
            ),

          offer:
            getField(
              record,
              [
                "OFFER"
              ]
            ),

          bay:
            getField(
              record,
              [
                "BAY",
                "BAY NO",
                "BAY NUMBER"
              ]
            ),

          shelf:
            getField(
              record,
              [
                "SHELF",
                "SHARED SHELF"
              ]
            ),

          comments:
            getField(
              record,
              [
                "COMMENTS"
              ]
            ),

          details:
            getField(
              record,
              [
                "DETAILS"
              ]
            ),

          instructions:
            getField(
              record,
              [
                "INSTRUCTIONS"
              ]
            )

        };


        /*
          Work out the promotional section.
        */

        entry.promotionType =
          getPromotionType(
            entry
          );


        /*
          Work out the actual numbered location.
        */

        entry.locationName =
          getActualLocation(
            entry
          );


        /*
          Only add genuine records.
        */

        if (
          entry.plan ||
          entry.location ||
          entry.type ||
          entry.bay ||
          entry.product ||
          entry.code
        ) {

          result.push(entry);

        }

      }
    );


    return result;

  }


  /* =========================================================
     FIELD READER
  ========================================================= */

  function getField(
    text,
    labels
  ) {

    for (
      const label of labels
    ) {

      const escaped =
        label.replace(
          /[.*+?^${}()|[\]\\]/g,
          "\\$&"
        );


      /*
        Normal newline format.
      */

      const regex =
        new RegExp(
          "(?:^|\\n)\\s*" +
          escaped +
          "\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*[A-Z][A-Z0-9 _/&-]*\\s*:|$)",
          "i"
        );


      const match =
        text.match(regex);


      if (
        match &&
        match[1]
      ) {

        return clean(
          match[1]
        );

      }


      /*
        Also support pipe-separated values.
      */

      const pipeRegex =
        new RegExp(
          "(?:^|\\|)\\s*" +
          escaped +
          "\\s*:\\s*([^|]*?)(?=\\||$)",
          "i"
        );


      const pipeMatch =
        text.match(
          pipeRegex
        );


      if (
        pipeMatch &&
        pipeMatch[1]
      ) {

        return clean(
          pipeMatch[1]
        );

      }

    }


    return "";

  }


  /* =========================================================
     PROMOTION TYPE
  ========================================================= */

  function getPromotionType(
    entry
  ) {

    const plan =
      String(
        entry.plan || ""
      ).toUpperCase();

    const location =
      String(
        entry.location || ""
      ).toUpperCase();

    const type =
      String(
        entry.type || ""
      ).toUpperCase();

    const bay =
      String(
        entry.bay || ""
      ).toUpperCase();


    const combined =
      [
        plan,
        location,
        type,
        bay
      ].join(" ");


    /*
      Specific sections FIRST.
    */

    if (
      combined.includes(
        "PROMO BAY PLASTIC TRAY"
      )
    ) {

      return "PROMO BAY PLASTIC TRAYS";

    }


    if (
      combined.includes(
        "PROMO BAY CLIP STRIP"
      )
    ) {

      return "PROMO BAY CLIP STRIPS";

    }


    if (
      /\bTILL\s+ENDS?\b/.test(
        combined
      )
    ) {

      return "TILL ENDS";

    }


    if (
      /\bTILL\s+FRONTS?\b/.test(
        combined
      )
    ) {

      return "TILL FRONTS";

    }


    /*
      END locations.
    */

    if (
      /\bEND\s*(?:-|:)?\s*\d+\b/.test(
        location
      ) ||
      /\bENDS?\s+\d+\b/.test(
        location
      ) ||
      combined.includes(
        "END GONDOLA"
      )
    ) {

      return "ENDS";

    }


    /*
      SIDE locations.
    */

    if (
      /\bSIDE\s*(?:-|:)?\s*\d+\b/.test(
        location
      ) ||
      /\bSIDES?\s+\d+\b/.test(
        location
      ) ||
      combined.includes(
        "SIDE GONDOLA"
      )
    ) {

      return "SIDES";

    }


    /*
      Promo Bay.
    */

    if (
      /\bBAY\s*(?:-|:)?\s*\d+\b/.test(
        location
      ) ||
      /\bBAY\s*(?:-|:)?\s*\d+\b/.test(
        bay
      ) ||
      combined.includes(
        "PROMO BAY"
      )
    ) {

      return "PROMO BAYS";

    }


    if (
      combined.includes(
        "FRONT OF STORE"
      )
    ) {

      return "FRONT OF STORE";

    }


    if (
      combined.includes(
        "WINDOW BASKET"
      )
    ) {

      return "WINDOW BASKETS";

    }


    if (
      combined.includes(
        "BULK STACK"
      )
    ) {

      return "BULK STACKS";

    }


    if (
      combined.includes(
        "PENCIL STACK"
      )
    ) {

      return "PENCIL STACKS";

    }


    if (
      combined.includes(
        "FSDU"
      ) ||
      combined.includes(
        "STAND"
      )
    ) {

      return "FSDU & STANDS";

    }


    if (
      combined.includes(
        "DUMP BIN"
      )
    ) {

      return "DUMP BINS";

    }


    if (
      combined.includes(
        "GIANT TIERED"
      ) ||
      combined.includes(
        "REAR HALF"
      )
    ) {

      return "GIANT TIERED BASKETS";

    }


    if (
      combined.includes(
        "CLIP STRIP"
      )
    ) {

      return "CLIP STRIPS";

    }


    if (
      combined.includes(
        "DRINKS CHILLER"
      ) ||
      combined.includes(
        "DRINK CHILLER"
      )
    ) {

      return "DRINKS CHILLER";

    }


    return "OTHER";

  }


  /* =========================================================
     ACTUAL LOCATION

     THIS IS THE IMPORTANT FIX.

     We search the location field first.

     If it is not there, we search plan/type/bay/details
     for an actual END / SIDE / BAY number.

     Therefore:

     END 17 -> END 17
     END 18 -> END 18
     SIDE 1 -> SIDE 1
     SIDE 2 -> SIDE 2
     BAY 1 -> BAY 1

     They will NOT become GENERAL.
  ========================================================= */

  function getActualLocation(
    entry
  ) {

    const type =
      entry.promotionType;


    /*
      END
    */

    if (
      type === "ENDS"
    ) {

      const values = [
        entry.location,
        entry.plan,
        entry.type,
        entry.comments,
        entry.details,
        entry.raw
      ];


      for (
        const value of values
      ) {

        const match =
          String(
            value || ""
          ).match(
            /\bEND(?:S)?\s*(?:-|:)?\s*(\d+)\b/i
          );


        if (match) {

          return `END ${match[1]}`;

        }

      }


      /*
        Also support forms such as:

        END17
        END-17
        END:17
      */

      for (
        const value of values
      ) {

        const match =
          String(
            value || ""
          ).match(
            /\bEND\s*[-#:]*\s*(\d+)\b/i
          );


        if (match) {

          return `END ${match[1]}`;

        }

      }

    }


    /*
      SIDE
    */

    if (
      type === "SIDES"
    ) {

      const values = [
        entry.location,
        entry.plan,
        entry.type,
        entry.comments,
        entry.details,
        entry.raw
      ];


      for (
        const value of values
      ) {

        const match =
          String(
            value || ""
          ).match(
            /\bSIDES?\s*[-#:]*\s*(\d+)\b/i
          );


        if (match) {

          return `SIDE ${match[1]}`;

        }

      }

    }


    /*
      PROMO BAY
    */

    if (
      type === "PROMO BAYS" ||
      type ===
        "PROMO BAY PLASTIC TRAYS" ||
      type ===
        "PROMO BAY CLIP STRIPS"
    ) {

      const values = [
        entry.location,
        entry.bay,
        entry.plan,
        entry.type,
        entry.comments,
        entry.details,
        entry.raw
      ];


      for (
        const value of values
      ) {

        const match =
          String(
            value || ""
          ).match(
            /\b(?:PROMO\s*)?BAY\s*[-#:]*\s*(\d+)\b/i
          );


        if (match) {

          return `BAY ${match[1]}`;

        }

      }

    }


    /*
      TILL END
    */

    if (
      type === "TILL ENDS"
    ) {

      const values = [
        entry.location,
        entry.plan,
        entry.type,
        entry.raw
      ];


      for (
        const value of values
      ) {

        const match =
          String(
            value || ""
          ).match(
            /\bTILL\s*END\s*[-#:]*\s*(\d+)\b/i
          );


        if (match) {

          return `TILL END ${match[1]}`;

        }

      }

    }


    /*
      TILL FRONT
    */

    if (
      type === "TILL FRONTS"
    ) {

      const values = [
        entry.location,
        entry.plan,
        entry.type,
        entry.raw
      ];


      for (
        const value of values
      ) {

        const match =
          String(
            value || ""
          ).match(
            /\bTILL\s*FRONT\s*[-#:]*\s*(\d+)\b/i
          );


        if (match) {

          return `TILL FRONT ${match[1]}`;

        }

      }

    }


    /*
      Other promotional areas:
      preserve their actual location.
    */

    if (
      clean(entry.location)
    ) {

      return clean(
        entry.location
      );

    }


    /*
      GENERAL is now only used when there really
      is no identifiable location.
    */

    return "GENERAL";

  }


  /* =========================================================
     PROMOTION LOADING
  ========================================================= */

  async function openPromotions() {

    stopScanner();

    showScreen(
      "promotionsScreen"
    );


    if (
      !promotionsLoaded
    ) {

      await loadPromotions();

    }


    renderPromotionTypes();

  }


  async function loadPromotions() {

    const container =
      document.getElementById(
        "promotionTypes"
      );


    container.innerHTML =
      `
      <div class="loading">
        Loading promotions...
      </div>
      `;


    promotionalProducts = [];


    try {

      const pageSize = 1000;

      let start = 0;


      while (true) {

        const end =
          start +
          pageSize -
          1;


        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select(
              "barcode,name,price,product_code,promo_offer"
            )
            .not(
              "promo_offer",
              "is",
              null
            )
            .neq(
              "promo_offer",
              ""
            )
            .range(
              start,
              end
            );


        if (error) {
          throw error;
        }


        if (
          !data ||
          data.length === 0
        ) {

          break;

        }


        promotionalProducts =
          promotionalProducts.concat(
            data
          );


        if (
          data.length <
          pageSize
        ) {

          break;

        }


        start += pageSize;

      }


      buildPromotionGroups();

      promotionsLoaded = true;


    } catch (error) {

      container.innerHTML =
        `
        <div class="error">

          Unable to load promotions.

          <br><br>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </div>
        `;

    }

  }


  /* =========================================================
     BUILD GROUPS
  ========================================================= */

  function buildPromotionGroups() {

    promotionGroups = {};


    promotionalProducts.forEach(
      product => {

        const entries =
          parsePromoOffer(
            product.promo_offer
          );


        entries.forEach(
          entry => {

            const type =
              entry.promotionType;

            const location =
              entry.locationName;


            if (!type) {
              return;
            }


            if (
              !promotionGroups[type]
            ) {

              promotionGroups[type] =
                {};

            }


            if (
              !promotionGroups[type][
                location
              ]
            ) {

              promotionGroups[type][
                location
              ] = [];

            }


            promotionGroups[type][
              location
            ].push({

              product:
                product,

              entry:
                entry

            });

          }
        );

      }
    );

  }


  /* =========================================================
     PROMOTION TYPES
  ========================================================= */

  function renderPromotionTypes() {

    const container =
      document.getElementById(
        "promotionTypes"
      );


    const order = [

      "ENDS",
      "SIDES",
      "TILL ENDS",
      "TILL FRONTS",
      "FRONT OF STORE",
      "WINDOW BASKETS",
      "PROMO BAYS",
      "PROMO BAY PLASTIC TRAYS",
      "PROMO BAY CLIP STRIPS",
      "BULK STACKS",
      "PENCIL STACKS",
      "FSDU & STANDS",
      "DUMP BINS",
      "GIANT TIERED BASKETS",
      "CLIP STRIPS",
      "DRINKS CHILLER",
      "OTHER"

    ];


    const available =
      Object.keys(
        promotionGroups
      );


    const types = [];


    order.forEach(
      type => {

        if (
          available.includes(type)
        ) {

          types.push(type);

        }

      }
    );


    available.forEach(
      type => {

        if (
          !types.includes(type)
        ) {

          types.push(type);

        }

      }
    );


    if (
      types.length === 0
    ) {

      container.innerHTML =
        `
        <div class="empty">
          No promotional information available.
        </div>
        `;

      return;

    }


    container.innerHTML =
      types
        .map(
          type => {

            const locations =
              promotionGroups[type];


            const locationCount =
              Object.keys(
                locations
              ).length;


            const productCount =
              Object.values(
                locations
              ).reduce(
                (
                  total,
                  items
                ) =>
                  total +
                  items.length,
                0
              );


            return `

              <div
                class="promo-section"
                onclick="
                  openPromotionLocations(
                    '${escapeAttribute(type)}'
                  )
                "
              >

                <div class="promo-section-icon">
                  ${shortName(type)}
                </div>


                <div class="promo-section-text">

                  <div class="promo-section-name">
                    ${escapeHtml(type)}
                  </div>

                  <div class="promo-section-sub">
                    ${locationCount}
                    ${
                      locationCount === 1
                        ? "location"
                        : "locations"
                    }
                  </div>

                </div>


                <div class="promo-count">
                  ${productCount} products
                </div>

              </div>

            `;

          }
        )
        .join("");

  }


  function shortName(type) {

    const names = {

      "ENDS": "E",
      "SIDES": "S",
      "TILL ENDS": "TE",
      "TILL FRONTS": "TF",
      "FRONT OF STORE": "FS",
      "WINDOW BASKETS": "WB",
      "PROMO BAYS": "B",
      "PROMO BAY PLASTIC TRAYS": "PT",
      "PROMO BAY CLIP STRIPS": "CS",
      "BULK STACKS": "BS",
      "PENCIL STACKS": "PS",
      "FSDU & STANDS": "F",
      "DUMP BINS": "DB",
      "GIANT TIERED BASKETS": "GT",
      "CLIP STRIPS": "C",
      "DRINKS CHILLER": "DC",
      "OTHER": "O"

    };


    return names[type] || "P";

  }


  /* =========================================================
     LOCATIONS
  ========================================================= */

  function openPromotionLocations(
    type
  ) {

    selectedPromotionType =
      type;


    selectedLocation = "";


    showScreen(
      "locationsScreen"
    );


    document.getElementById(
      "locationsTitle"
    ).textContent =
      type;


    const container =
      document.getElementById(
        "locationsList"
      );


    const locations =
      promotionGroups[type] ||
      {};


    const names =
      Object.keys(
        locations
      );


    /*
      Sort numerically:

      END 1
      END 2
      END 3
      ...
      END 10

      NOT:

      END 1
      END 10
      END 2
    */

    names.sort(
      naturalSort
    );


    if (
      names.length === 0
    ) {

      container.innerHTML =
        `
        <div class="empty">
          No locations found.
        </div>
        `;

      return;

    }


    container.innerHTML =
      names
        .map(
          (
            location,
            index
          ) => {

            const count =
              locations[
                location
              ].length;


            return `

              <div
                class="location-card"
                onclick="
                  openPromotionProducts(
                    '${escapeAttribute(location)}'
                  )
                "
              >

                <div class="location-number">
                  ${locationNumber(
                    location,
                    index
                  )}
                </div>


                <div class="location-content">

                  <div class="location-name">
                    ${escapeHtml(
                      location
                    )}
                  </div>

                  <div class="location-sub">
                    ${count}
                    ${
                      count === 1
                        ? "product"
                        : "products"
                    }
                  </div>

                </div>


                <div class="location-arrow">
                  →
                </div>

              </div>

            `;

          }
        )
        .join("");

  }


  function locationNumber(
    location,
    index
  ) {

    const match =
      String(location)
        .match(
          /(\d+)/
        );


    if (match) {
      return match[1];
    }


    return index + 1;

  }


  /* =========================================================
     PRODUCTS IN LOCATION
  ========================================================= */

  function openPromotionProducts(
    location
  ) {

    selectedLocation =
      location;


    showScreen(
      "promoProductsScreen"
    );


    document.getElementById(
      "promoProductsTitle"
    ).textContent =
      `${selectedPromotionType} — ${location}`;


    const products =
      (
        promotionGroups[
          selectedPromotionType
        ] || {}
      )[location] || [];


    document.getElementById(
      "promoProductsSummary"
    ).textContent =
      `${products.length} ${
        products.length === 1
          ? "product"
          : "products"
      }`;


    const container =
      document.getElementById(
        "promoProductsList"
      );


    if (
      products.length === 0
    ) {

      container.innerHTML =
        `
        <div class="empty">
          No products found for
          <strong>
            ${escapeHtml(location)}
          </strong>.
        </div>
        `;

      return;

    }


    container.innerHTML =
      products
        .map(
          (
            item,
            index
          ) =>
            buildPromoProduct(
              item,
              index
            )
        )
        .join("");

  }


  function backToLocations() {

    openPromotionLocations(
      selectedPromotionType
    );

  }


  /* =========================================================
     PROMO PRODUCT
  ========================================================= */

  function buildPromoProduct(
    item,
    index
  ) {

    const product =
      item.product;

    const entry =
      item.entry;


    let html = `

      <div class="promo-product">

        <div class="product-number">
          PRODUCT ${index + 1}
        </div>


        <div class="promo-product-name">
          ${escapeHtml(
            product.name ||
            entry.product ||
            "Unnamed product"
          )}
        </div>


        <div class="promo-product-price">
          ${formatPrice(
            product.price
          )}
        </div>


        <div class="small-row">

          <strong>Barcode:</strong>

          ${escapeHtml(
            product.barcode ||
            "-"
          )}

        </div>


        <div class="small-row">

          <strong>Product Code:</strong>

          ${escapeHtml(
            product.product_code ||
            "-"
          )}

        </div>

    `;


    if (
      entry.categories
    ) {

      html += `

        <div class="small-row">

          <strong>
            Store Categories:
          </strong>

          ${escapeHtml(
            entry.categories
          )}

        </div>

      `;

    }


    const promotionalPrice =
      entry.promoPrice ||
      entry.price;


    if (
      promotionalPrice
    ) {

      html += `

        <div class="small-row">

          <strong>
            Promotional Price:
          </strong>

          ${escapeHtml(
            promotionalPrice
          )}

        </div>

      `;

    }


    if (
      entry.offer
    ) {

      html += `

        <div class="small-row">

          <strong>
            Offer:
          </strong>

          ${escapeHtml(
            entry.offer
          )}

        </div>

      `;

    }


    if (
      entry.shelf
    ) {

      html += `

        <div class="small-row">

          <strong>
            Shelf:
          </strong>

          ${escapeHtml(
            entry.shelf
          )}

        </div>

      `;

    }


    if (
      entry.comments
    ) {

      html += `

        <div class="small-row">

          <strong>
            Comments:
          </strong>

          ${escapeHtml(
            entry.comments
          )}

        </div>

      `;

    }


    if (
      entry.details
    ) {

      html += `

        <div class="small-row">

          <strong>
            Details:
          </strong>

          ${escapeHtml(
            entry.details
          )}

        </div>

      `;

    }


    html += `
      </div>
    `;


    return html;

  }


  /* =========================================================
     PRODUCT PROMO INFORMATION
  ========================================================= */

  function buildPromoEntry(
    entry,
    index
  ) {

    const title =
      entry.locationName ||
      entry.plan ||
      `Promotion ${index + 1}`;


    let html = `

      <div class="promo-entry">

        <div class="promo-entry-title">
          ${escapeHtml(title)}
        </div>

    `;


    if (
      entry.location &&
      entry.location !==
        entry.locationName
    ) {

      html +=
        promoLine(
          "Placement",
          entry.location
        );

    }


    if (
      entry.categories
    ) {

      html +=
        promoLine(
          "Store Categories",
          entry.categories
        );

    }


    if (
      entry.code
    ) {

      html +=
        promoLine(
          "Product Code",
          entry.code
        );

    }


    if (
      entry.barcode
    ) {

      html +=
        promoLine(
          "Barcode",
          entry.barcode
        );

    }


    if (
      entry.product
    ) {

      html +=
        promoLine(
          "Product",
          entry.product
        );

    }


    const promotionalPrice =
      entry.promoPrice ||
      entry.price;


    if (
      promotionalPrice
    ) {

      html +=
        promoLine(
          "Promotional Price",
          promotionalPrice
        );

    }


    if (
      entry.offer
    ) {

      html +=
        promoLine(
          "Offer",
          entry.offer
        );

    }


    if (
      entry.bay
    ) {

      html +=
        promoLine(
          "Bay",
          entry.bay
        );

    }


    if (
      entry.shelf
    ) {

      html +=
        promoLine(
          "Shelf",
          entry.shelf
        );

    }


    if (
      entry.comments
    ) {

      html +=
        promoLine(
          "Comments",
          entry.comments
        );

    }


    if (
      entry.details
    ) {

      html +=
        promoLine(
          "Details",
          entry.details
        );

    }


    html += `
      </div>
    `;


    return html;

  }


  function promoLine(
    label,
    value
  ) {

    return `

      <div class="promo-line">

        <div class="promo-line-label">
          ${escapeHtml(label)}
        </div>

        <div class="promo-line-value">
          ${escapeHtml(value)}
        </div>

      </div>

    `;

  }


  /* =========================================================
     NATURAL SORT
  ========================================================= */

  function naturalSort(
    a,
    b
  ) {

    const aText =
      String(a);

    const bText =
      String(b);


    const aMatch =
      aText.match(
        /(\d+)/
      );

    const bMatch =
      bText.match(
        /(\d+)/
      );


    if (
      aMatch &&
      bMatch
    ) {

      const aNumber =
        Number(
          aMatch[1]
        );

      const bNumber =
        Number(
          bMatch[1]
        );


      if (
        aNumber !==
        bNumber
      ) {

        return (
          aNumber -
          bNumber
        );

      }

    }


    return aText.localeCompare(
      bText,
      undefined,
      {
        numeric: true,
        sensitivity: "base"
      }
    );

  }


  /* =========================================================
     PRICE
  ========================================================= */

  function formatPrice(
    value
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      return "—";

    }


    const number =
      Number(value);


    if (
      Number.isNaN(number)
    ) {

      return escapeHtml(
        String(value)
      );

    }


    return (
      "£" +
      number.toFixed(2)
    );

  }


  /* =========================================================
     CLEAN
  ========================================================= */

  function clean(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)
      .replace(
        /\r/g,
        ""
      )
      .trim();

  }


  /* =========================================================
     ESCAPE
  ========================================================= */

  function escapeHtml(
    value
  ) {

    if (
      value === null ||
      value === undefined
    ) {

      return "";

    }


    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(
    value
  ) {

    return String(value)
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      );

  }
