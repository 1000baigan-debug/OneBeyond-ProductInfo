<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>One Beyond Price Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      background: #111;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.8;
    }

    main {
      padding: 24px 20px;
    }

    .scan-button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 22px;
      font-size: 20px;
      font-weight: 700;
      background: #ffd500;
      color: #111;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .manual {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 17px;
    }

    .search {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 700;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .result {
      margin-top: 25px;
      padding: 24px;
      border-radius: 16px;
      background: #f1f1f1;
      text-align: center;
    }

    .result h2 {
      margin: 0 0 10px;
    }

    .price {
      font-size: 52px;
      font-weight: 800;
      margin-top: 15px;
    }

    .not-found {
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: #ffe5e5;
      text-align: center;
    }

    #scanner {
      display: none;
      margin-top: 20px;
    }

    #reader {
      width: 100%;
    }

    .close {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>ONE BEYOND</h1>
    <p>Barcode Price Checker</p>
  </header>

  <main>

    <button class="scan-button" onclick="startScanner()">
      📷 Scan Barcode
    </button>

    <div class="manual">

      <input
        id="barcodeInput"
        type="text"
        inputmode="numeric"
        placeholder="Enter barcode"
      >

      <button class="search" onclick="searchBarcode()">
        Search
      </button>

    </div>

    <div id="scanner">

      <div id="reader"></div>

      <button class="close" onclick="stopScanner()">
        Close Scanner
      </button>

    </div>

    <div id="result"></div>

  </main>

</div>


<!-- Barcode scanner -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

  /* =========================
     SUPABASE
     ========================= */

  const SUPABASE_URL =
    "https://nmfjavzrxghvklkjtfaq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     SCANNER
     ========================= */

  let scanner = null;


  /* =========================
     ESCAPE HTML
     ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     BARCODE LOOKUP
     ========================= */

  async function lookupBarcode(code) {

    code = String(code).trim();

    const result =
      document.getElementById("result");


    if (!code) {

      result.innerHTML = "";

      return;

    }


    result.innerHTML = `
      <div class="result">
        <h2>Checking price...</h2>
      </div>
    `;


    try {

      const response =
        await supabaseClient
          .from("products")
          .select("barcode, name, price")
          .eq("barcode", code)
          .maybeSingle();


      const data = response.data;
      const error = response.error;


      if (error) {

        console.error(
          "Supabase error:",
          error
        );


        result.innerHTML = `
          <div class="not-found">

            <h2>Database error</h2>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>
        `;

        return;

      }


      if (data) {

        result.innerHTML = `
          <div class="result">

            <h2>
              ${escapeHtml(data.name)}
            </h2>

            <div>
              Barcode:
              ${escapeHtml(data.barcode)}
            </div>

            <div class="price">
              £${escapeHtml(data.price)}
            </div>

          </div>
        `;

      } else {

        result.innerHTML = `
          <div class="not-found">

            <h2>Product not found</h2>

            <p>
              Barcode:
              ${escapeHtml(code)}
            </p>

          </div>
        `;

      }


    } catch (error) {

      console.error(
        "Unexpected error:",
        error
      );


      result.innerHTML = `
        <div class="not-found">

          <h2>Something went wrong</h2>

          <p>
            Please try again.
          </p>

        </div>
      `;

    }

  }


  /* =========================
     SEARCH BUTTON
     ========================= */

  function searchBarcode() {

    const input =
      document.getElementById(
        "barcodeInput"
      );


    const code = input.value;


    lookupBarcode(code);

  }


  /* =========================
     START SCANNER
     ========================= */

  function startScanner() {

    const scannerBox =
      document.getElementById(
        "scanner"
      );


    scannerBox.style.display =
      "block";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 150
        }
      },


      function(decodedText) {

        document.getElementById(
          "barcodeInput"
        ).value = decodedText;


        lookupBarcode(
          decodedText
        );


        stopScanner();

      },


      function(errorMessage) {

        // Scanner continues looking.
        // No action needed here.

      }

    ).catch(function(error) {

      console.error(
        "Camera error:",
        error
      );


      alert(
        "Unable to access the camera. Please allow camera access."
      );


      scannerBox.style.display =
        "none";

    });

  }


  /* =========================
     STOP SCANNER
     ========================= */

  function stopScanner() {

    if (scanner) {

      scanner.stop()

        .then(function() {

          scanner.clear();

        })

        .catch(function(error) {

          console.error(
            "Scanner stop error:",
            error
          );

        });


      scanner = null;

    }


    document.getElementById(
      "scanner"
    ).style.display = "none";

  }

</script>

</body>
</html>
