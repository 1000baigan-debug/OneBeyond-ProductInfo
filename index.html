<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Beyond Price Checker</title>

<meta name="theme-color" content="#2b5db8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f2f4;
  color: #222;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

/* HEADER */

.header {
  background: #2b5db8;
  color: white;
  text-align: center;
  padding: 34px 15px 32px;
  border-bottom: 9px solid #f8d43f;
}

.header-title {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 1px;
}

.header-subtitle {
  margin-top: 12px;
  font-size: 24px;
}

/* APP */

.app {
  max-width: 850px;
  margin: auto;
  padding: 22px 18px 50px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* HOME */

.main-card {
  background: white;
  border-radius: 25px;
  padding: 34px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.main-heading {
  margin: 0 0 25px;
  color: #2b5db8;
  font-size: 34px;
  font-weight: 800;
}

.main-description {
  margin-bottom: 28px;
  color: #666;
  font-size: 22px;
  line-height: 1.4;
}

.mode-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 24px;
}

.mode-button {
  height: 70px;
  border: 4px solid #d6d6d6;
  border-radius: 18px;
  background: white;
  color: #555;
  font-size: 22px;
  font-weight: 800;
}

.mode-button.active {
  background: #2b5db8;
  border-color: #2b5db8;
  color: white;
}

.input-box {
  width: 100%;
  height: 88px;
  margin-bottom: 18px;
  padding: 0 24px;
  border: 4px solid #2b5db8;
  border-radius: 18px;
  outline: none;
  font-size: 27px;
}

.input-box::placeholder {
  color: #aaa;
}

.yellow-button,
.blue-button {
  width: 100%;
  height: 82px;
  border: none;
  border-radius: 18px;
  font-size: 26px;
  font-weight: 900;
}

.yellow-button {
  margin-bottom: 18px;
  background: #f8d43f;
  color: #111;
}

.blue-button {
  background: #2b5db8;
  color: white;
}

.promotions-home-button {
  margin-top: 20px;
  height: 68px;
  font-size: 21px;
}

.footer-text {
  text-align: center;
  color: #777;
  font-size: 19px;
  margin-top: 50px;
}

/* PAGE HEADERS */

.page-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
}

.back-button {
  border: none;
  background: transparent;
  color: #2b5db8;
  font-size: 17px;
  font-weight: 700;
  padding: 5px;
}

.page-title {
  margin: 0;
  color: #2b5db8;
  font-size: 28px;
  font-weight: 900;
}

/* SCANNER */

.scanner-card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 15px;
}

.scanner-message {
  padding-top: 15px;
  text-align: center;
  color: #666;
  font-size: 15px;
}

/* RESULT */

.result-card {
  margin-top: 18px;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.product-name {
  margin-bottom: 20px;
  color: #2b5db8;
  font-size: 25px;
  font-weight: 900;
  line-height: 1.3;
}

.price-label {
  color: #777;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.price {
  margin-bottom: 22px;
  font-size: 42px;
  font-weight: 900;
}

.detail-row {
  padding: 11px 0;
  border-top: 1px solid #ddd;
}

.detail-label {
  margin-bottom: 4px;
  color: #777;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.detail-value {
  font-size: 16px;
  word-break: break-word;
}

/* PROMOTIONAL INFORMATION */

.promo-heading {
  margin-top: 25px;
  margin-bottom: 14px;
  padding-bottom: 9px;
  border-bottom: 3px solid #2b5db8;
  color: #2b5db8;
  font-size: 21px;
  font-weight: 900;
}

.promo-entry {
  margin-bottom: 12px;
  padding: 17px;
  background: #f7f9fc;
  border: 1px solid #dce2ea;
  border-radius: 15px;
}

.promo-entry-title {
  margin-bottom: 13px;
  font-size: 19px;
  font-weight: 900;
}

.promo-row {
  margin-bottom: 10px;
}

.promo-row:last-child {
  margin-bottom: 0;
}

.promo-label {
  color: #777;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.promo-value {
  margin-top: 2px;
  font-size: 15px;
  line-height: 1.4;
  white-space: pre-line;
}

/* PROMOTION SECTIONS */

.promotion-description {
  margin-bottom: 17px;
  color: #666;
  font-size: 15px;
}

.promotion-card {
  display: flex;
  align-items: center;
  min-height: 76px;
  margin-bottom: 11px;
  padding: 15px 18px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.promotion-icon {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 14px;
  border-radius: 12px;
  background: #eaf0fb;
  color: #2b5db8;
  font-size: 14px;
  font-weight: 900;
}

.promotion-text {
  flex: 1;
}

.promotion-name {
  font-size: 17px;
  font-weight: 900;
}

.promotion-sub {
  margin-top: 4px;
  color: #777;
  font-size: 12px;
}

.count-badge {
  padding: 7px 10px;
  border-radius: 15px;
  background: #eaf0fb;
  color: #2b5db8;
  font-size: 12px;
  font-weight: 900;
}

/* LOCATIONS */

.location-card {
  display: flex;
  align-items: center;
  min-height: 78px;
  margin-bottom: 11px;
  padding: 14px 18px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.location-number {
  width: 47px;
  height: 47px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 14px;
  border-radius: 12px;
  background: #2b5db8;
  color: white;
  font-size: 15px;
  font-weight: 900;
}

.location-info {
  flex: 1;
}

.location-name {
  font-size: 18px;
  font-weight: 900;
}

.location-count {
  margin-top: 4px;
  color: #777;
  font-size: 12px;
}

.location-arrow {
  color: #2b5db8;
  font-size: 26px;
}

/* PROMO PRODUCTS */

.products-count {
  margin: -8px 0 15px;
  color: #777;
  font-size: 14px;
}

.promo-product {
  margin-bottom: 11px;
  padding: 18px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.product-number {
  margin-bottom: 8px;
  color: #2b5db8;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
}

.promo-product-name {
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 900;
  line-height: 1.3;
}

.promo-product-price {
  margin-bottom: 13px;
  font-size: 24px;
  font-weight: 900;
}

.product-info-row {
  margin-bottom: 6px;
  color: #555;
  font-size: 13px;
  line-height: 1.4;
}

.product-info-row strong {
  color: #222;
}

/* STATES */

.loading,
.empty,
.error {
  padding: 25px 20px;
  background: white;
  border-radius: 16px;
  text-align: center;
}

.loading,
.empty {
  color: #777;
}

.error {
  background: #fff0f2;
  border: 1px solid #ffcbd2;
  color: #9f1239;
  text-align: left;
  line-height: 1.5;
}

@media (max-width: 600px) {

  .header {
    padding: 28px 12px;
  }

  .header-title {
    font-size: 35px;
  }

  .header-subtitle {
    font-size: 22px;
  }

  .app {
    padding: 18px 14px 40px;
  }

  .main-card {
    padding: 25px 20px;
  }

  .main-heading {
    font-size: 31px;
  }

  .main-description {
    font-size: 20px;
  }

  .mode-button {
    font-size: 19px;
  }

  .input-box {
    font-size: 22px;
  }

  .yellow-button,
  .blue-button {
    font-size: 23px;
  }
}
</style>
</head>


<body>

<header class="header">
  <div class="header-title">ONE BEYOND</div>
  <div class="header-subtitle">Price Checker</div>
</header>


<main class="app">

  <!-- HOME -->

  <section id="homeScreen" class="screen active">

    <div class="main-card">

      <h1 class="main-heading">
        Find a Product
      </h1>

      <div class="main-description">
        Search using a product barcode or product code.
      </div>

      <div class="mode-buttons">

        <button
          id="barcodeMode"
          class="mode-button active"
          onclick="setSearchMode('barcode')">
          Barcode
        </button>

        <button
          id="productCodeMode"
          class="mode-button"
          onclick="setSearchMode('product_code')">
          Product Code
        </button>

      </div>

      <input
        id="searchInput"
        class="input-box"
        type="text"
        placeholder="Enter barcode"
        autocomplete="off">

      <button
        class="yellow-button"
        onclick="searchProduct()">
        Search Product
      </button>

      <button
        class="blue-button"
        onclick="openScanner()">
        Scan Barcode
      </button>

    </div>

    <div class="footer-text">
      One Beyond Price Checker
    </div>

    <button
      class="blue-button promotions-home-button"
      onclick="openPromotions()">
      Promotions
    </button>

  </section>


  <!-- SCANNER -->

  <section id="scannerScreen" class="screen">

    <div class="page-header">

      <button
        class="back-button"
        onclick="goHome()">
        ← Back
      </button>

      <h2 class="page-title">
        Scan Barcode
      </h2>

    </div>

    <div class="scanner-card">

      <div id="reader"></div>

      <div
        id="scannerMessage"
        class="scanner-message">
        Starting camera...
      </div>

    </div>

    <div id="scannerResult"></div>

  </section>


  <!-- SEARCH RESULT -->

  <section id="searchResultScreen" class="screen">

    <div class="page-header">

      <button
        class="back-button"
        onclick="goHome()">
        ← Back
      </button>

      <h2 class="page-title">
        Product
      </h2>

    </div>

    <div id="searchResult"></div>

  </section>


  <!-- PROMOTIONS -->

  <section id="promotionsScreen" class="screen">

    <div class="page-header">

      <button
        class="back-button"
        onclick="goHome()">
        ← Back
      </button>

      <h2 class="page-title">
        Promotions
      </h2>

    </div>

    <div class="promotion-description">
      Select a promotional area to view its locations.
    </div>

    <div id="promotionTypes">
      <div class="loading">
        Loading promotions...
      </div>
    </div>

  </section>


  <!-- LOCATIONS -->

  <section id="locationsScreen" class="screen">

    <div class="page-header">

      <button
        class="back-button"
        onclick="openPromotions()">
        ← Back
      </button>

      <h2
        id="locationsTitle"
        class="page-title">
        Locations
      </h2>

    </div>

    <div id="locationsList"></div>

  </section>


  <!-- PRODUCTS IN LOCATION -->

  <section id="promoProductsScreen" class="screen">

    <div class="page-header">

      <button
        class="back-button"
        onclick="backToLocations()">
        ← Back
      </button>

      <h2
        id="promoProductsTitle"
        class="page-title">
        Products
      </h2>

    </div>

    <div
      id="promoProductsCount"
      class="products-count">
    </div>

    <div id="promoProductsList"></div>

  </section>

</main>


<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
  "https://nmfjavzrxghvklkjtfaq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================================
   VARIABLES
========================================================== */

let searchMode = "barcode";

let scanner = null;

let promotionsLoaded = false;

let promotionData = {};

let selectedPromotion = "";

let selectedLocation = "";


/* ==========================================================
   SCREEN CONTROL
========================================================== */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(screen => {
      screen.classList.remove("active");
    });

  const screen =
    document.getElementById(id);

  if (screen) {
    screen.classList.add("active");
  }

  window.scrollTo(0, 0);
}


function goHome() {

  stopScanner();

  showScreen("homeScreen");
}


/* ==========================================================
   SEARCH MODE
========================================================== */

function setSearchMode(mode) {

  searchMode = mode;

  const barcodeButton =
    document.getElementById("barcodeMode");

  const productCodeButton =
    document.getElementById("productCodeMode");

  const input =
    document.getElementById("searchInput");


  if (mode === "barcode") {

    barcodeButton.classList.add("active");

    productCodeButton.classList.remove("active");

    input.placeholder =
      "Enter barcode";

  } else {

    barcodeButton.classList.remove("active");

    productCodeButton.classList.add("active");

    input.placeholder =
      "Enter product code";
  }

  input.value = "";

  input.focus();
}


/* ==========================================================
   SEARCH PRODUCT
========================================================== */

async function searchProduct() {

  const input =
    document.getElementById("searchInput");

  const value =
    input.value.trim();


  if (!value) {

    alert(
      searchMode === "barcode"
        ? "Please enter a barcode."
        : "Please enter a product code."
    );

    return;
  }


  showScreen("searchResultScreen");


  document.getElementById(
    "searchResult"
  ).innerHTML =
    `<div class="loading">Searching...</div>`;


  try {

    let query =
      db
        .from("products")
        .select(
          "barcode,name,price,product_code,promo_offer"
        );


    if (searchMode === "barcode") {

      query =
        query.eq(
          "barcode",
          value
        );

    } else {

      query =
        query.eq(
          "product_code",
          value
        );

    }


    const {
      data,
      error
    } =
      await query
        .order(
          "product_code",
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    if (!data || data.length === 0) {

      document.getElementById(
        "searchResult"
      ).innerHTML =
        `
        <div class="empty">
          No product found.
          <br><br>
          <strong>${escapeHtml(value)}</strong>
        </div>
        `;

      return;
    }


    document.getElementById(
      "searchResult"
    ).innerHTML =
      data
        .map(product =>
          buildProductResult(product)
        )
        .join("");


  } catch (error) {

    showError(
      "searchResult",
      error
    );
  }
}


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        searchProduct();
      }

    }
  );


/* ==========================================================
   SCANNER
========================================================== */

async function openScanner() {

  stopScanner();

  showScreen("scannerScreen");


  document.getElementById(
    "scannerResult"
  ).innerHTML = "";


  document.getElementById(
    "scannerMessage"
  ).textContent =
    "Starting camera...";


  scanner =
    new Html5Qrcode("reader");


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 150
        }
      },

      async function(decodedText) {

        await scannerLookup(
          decodedText
        );

      },

      function() {}

    );


    document.getElementById(
      "scannerMessage"
    ).textContent =
      "Point the camera at a product barcode.";


  } catch (error) {

    document.getElementById(
      "scannerMessage"
    ).innerHTML =
      `
      <div class="error">
        Camera could not be started.
        Please allow camera access and try again.
      </div>
      `;

  }
}


async function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    if (scanner.isScanning) {
      await scanner.stop();
    }

    scanner.clear();

  } catch (error) {
  }


  scanner = null;
}


async function scannerLookup(barcode) {

  const value =
    String(barcode).trim();


  if (!value) {
    return;
  }


  document.getElementById(
    "scannerMessage"
  ).textContent =
    "Checking product...";


  try {

    const {
      data,
      error
    } =
      await db
        .from("products")
        .select(
          "barcode,name,price,product_code,promo_offer"
        )
        .eq(
          "barcode",
          value
        )
        .order(
          "product_code",
          {
            ascending: true
          }
        );


    if (error) {
      throw error;
    }


    if (!data || data.length === 0) {

      document.getElementById(
        "scannerResult"
      ).innerHTML =
        `
        <div class="empty">

          No product found for:

          <br><br>

          <strong>
            ${escapeHtml(value)}
          </strong>

        </div>
        `;

      return;
    }


    document.getElementById(
      "scannerResult"
    ).innerHTML =
      data
        .map(product =>
          buildProductResult(product)
        )
        .join("");


    document.getElementById(
      "scannerMessage"
    ).textContent =
      "Product found.";


  } catch (error) {

    showError(
      "scannerResult",
      error
    );
  }
}


/* ==========================================================
   PRODUCT RESULT
========================================================== */

function buildProductResult(product) {

  const promotions =
    parsePromotions(
      product.promo_offer
    );


  let html = `

    <div class="result-card">

      <div class="product-name">
        ${escapeHtml(
          product.name ||
          "Unnamed product"
        )}
      </div>

      <div class="price-label">
        Current Price
      </div>

      <div class="price">
        ${formatPrice(product.price)}
      </div>

      <div class="detail-row">

        <div class="detail-label">
          Barcode
        </div>

        <div class="detail-value">
          ${escapeHtml(
            product.barcode || "-"
          )}
        </div>

      </div>

      <div class="detail-row">

        <div class="detail-label">
          Product Code
        </div>

        <div class="detail-value">
          ${escapeHtml(
            product.product_code || "-"
          )}
        </div>

      </div>

      <div class="promo-heading">
        Promotional Information
      </div>
  `;


  if (promotions.length === 0) {

    html += `
      <div class="empty">
        No promotional information recorded
        for this product.
      </div>
    `;

  } else {

    promotions.forEach(
      (promo, index) => {

        html +=
          buildPromoInformation(
            promo,
            index
          );

      }
    );
  }


  html += `
    </div>
  `;


  return html;
}


/* ==========================================================
   PROMOTION PARSER

   Reads the exact information stored by admin.html.

   Example:

   PLAN: END GONDOLAS
   LOCATION: END 17
   STORE CATEGORIES: B,C,D,E
   CODE: XMA123
   PRODUCT: Product name
   PROMO PRICE: £1.00
========================================================== */

function parsePromotions(text) {

  if (!text) {
    return [];
  }


  const cleanText =
    String(text)
      .replace(/\r/g, "")
      .trim();


  if (!cleanText) {
    return [];
  }


  let blocks =
    cleanText
      .split(
        /(?=^\s*PLAN\s*:)/im
      )
      .map(block =>
        block.trim()
      )
      .filter(Boolean);


  if (blocks.length === 0) {
    blocks = [cleanText];
  }


  return blocks.map(
    block => {

      const promotion = {

        plan:
          getField(
            block,
            ["PLAN"]
          ),

        location:
          getField(
            block,
            [
              "LOCATION",
              "PLACEMENT"
            ]
          ),

        type:
          getField(
            block,
            ["TYPE"]
          ),

        categories:
          getField(
            block,
            [
              "STORE CATEGORIES",
              "CATEGORIES"
            ]
          ),

        code:
          getField(
            block,
            [
              "CODE",
              "PRODUCT CODE"
            ]
          ),

        barcode:
          getField(
            block,
            ["BARCODE"]
          ),

        product:
          getField(
            block,
            [
              "PRODUCT",
              "DESCRIPTION"
            ]
          ),

        promoPrice:
          getField(
            block,
            [
              "PROMO PRICE",
              "PROMOTIONAL PRICE"
            ]
          ),

        offer:
          getField(
            block,
            ["OFFER"]
          ),

        bay:
          getField(
            block,
            [
              "BAY",
              "BAY NO",
              "BAY NUMBER"
            ]
          ),

        shelf:
          getField(
            block,
            [
              "SHELF",
              "SHARED SHELF"
            ]
          ),

        comments:
          getField(
            block,
            ["COMMENTS"]
          ),

        details:
          getField(
            block,
            [
              "DETAILS",
              "INSTRUCTIONS"
            ]
          ),

        raw: block

      };


      promotion.section =
        identifySection(
          promotion
        );


      promotion.actualLocation =
        identifyLocation(
          promotion
        );


      return promotion;

    }
  );
}


/* ==========================================================
   FIELD READER
========================================================== */

function getField(
  text,
  names
) {

  for (
    const name of names
  ) {

    const escaped =
      name.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );


    const regex =
      new RegExp(
        "(?:^|\\n)\\s*" +
        escaped +
        "\\s*:\\s*" +
        "([\\s\\S]*?)" +
        "(?=\\n\\s*[A-Z][A-Z0-9 _/&-]*\\s*:|$)",
        "i"
      );


    const match =
      text.match(regex);


    if (
      match &&
      match[1]
    ) {

      return clean(
        match[1]
      );

    }
  }


  return "";
}


/* ==========================================================
   SECTION IDENTIFICATION
========================================================== */

function identifySection(promo) {

  const text =
    [
      promo.plan,
      promo.location,
      promo.type,
      promo.bay,
      promo.raw
    ]
      .join(" ")
      .toUpperCase();


  /* Specific sections first */

  if (
    /\bTILL\s+ENDS?\b/.test(text)
  ) {
    return "TILL ENDS";
  }


  if (
    /\bTILL\s+FRONTS?\b/.test(text)
  ) {
    return "TILL FRONTS";
  }


  if (
    /\bEND\s*(?:-|:)?\s*\d+\b/.test(
      promo.location
    ) ||
    /\bEND\s*(?:-|:)?\s*\d+\b/.test(
      promo.raw
    ) ||
    text.includes("END GONDOLA")
  ) {
    return "ENDS";
  }


  if (
    /\bSIDE\s*(?:-|:)?\s*\d+\b/.test(
      promo.location
    ) ||
    /\bSIDE\s*(?:-|:)?\s*\d+\b/.test(
      promo.raw
    ) ||
    text.includes("SIDE GONDOLA")
  ) {
    return "SIDES";
  }


  if (
    /\bBAY\s*(?:-|:)?\s*\d+\b/.test(
      promo.location
    ) ||
    /\bBAY\s*(?:-|:)?\s*\d+\b/.test(
      promo.bay
    ) ||
    text.includes("PROMO BAY")
  ) {
    return "PROMO BAYS";
  }


  if (
    text.includes("FRONT OF STORE")
  ) {
    return "FRONT OF STORE";
  }


  if (
    text.includes("WINDOW BASKET")
  ) {
    return "WINDOW BASKETS";
  }


  if (
    text.includes("BULK STACK")
  ) {
    return "BULK STACKS";
  }


  if (
    text.includes("PENCIL STACK")
  ) {
    return "PENCIL STACKS";
  }


  if (
    text.includes("FSDU") ||
    text.includes("STAND")
  ) {
    return "FSDU & STANDS";
  }


  if (
    text.includes("DUMP BIN")
  ) {
    return "DUMP BINS";
  }


  if (
    text.includes("GIANT TIERED")
  ) {
    return "GIANT TIERED BASKETS";
  }


  if (
    text.includes("CLIP STRIP")
  ) {
    return "CLIP STRIPS";
  }


  if (
    text.includes("DRINKS CHILLER") ||
    text.includes("DRINK CHILLER")
  ) {
    return "DRINKS CHILLER";
  }


  return "OTHER";
}


/* ==========================================================
   LOCATION IDENTIFICATION

   This is the important part.

   END 1 -> END 1
   END 2 -> END 2

   SIDE 1 -> SIDE 1
   SIDE 2 -> SIDE 2

   BAY 1 -> BAY 1
   BAY 2 -> BAY 2
========================================================== */

function identifyLocation(promo) {

  const section =
    promo.section;


  const values = [

    promo.location,
    promo.bay,
    promo.type,
    promo.plan,
    promo.comments,
    promo.details,
    promo.raw

  ];


  /* ENDS */

  if (section === "ENDS") {

    for (
      const value of values
    ) {

      const match =
        String(value || "")
          .match(
            /\bEND(?:S)?\s*[-:#]?\s*(\d+)\b/i
          );


      if (match) {

        return "END " + match[1];

      }
    }
  }


  /* SIDES */

  if (section === "SIDES") {

    for (
      const value of values
    ) {

      const match =
        String(value || "")
          .match(
            /\bSIDE(?:S)?\s*[-:#]?\s*(\d+)\b/i
          );


      if (match) {

        return "SIDE " + match[1];

      }
    }
  }


  /* PROMO BAYS */

  if (section === "PROMO BAYS") {

    for (
      const value of values
    ) {

      const match =
        String(value || "")
          .match(
            /\b(?:PROMO\s*)?BAY\s*[-:#]?\s*(\d+)\b/i
          );


      if (match) {

        return "BAY " + match[1];

      }
    }
  }


  /* TILL ENDS */

  if (section === "TILL ENDS") {

    for (
      const value of values
    ) {

      const match =
        String(value || "")
          .match(
            /\bTILL\s*END\s*[-:#]?\s*(\d+)\b/i
          );


      if (match) {

        return "TILL END " + match[1];

      }
    }
  }


  /* TILL FRONTS */

  if (section === "TILL FRONTS") {

    for (
      const value of values
    ) {

      const match =
        String(value || "")
          .match(
            /\bTILL\s*FRONT\s*[-:#]?\s*(\d+)\b/i
          );


      if (match) {

        return "TILL FRONT " + match[1];

      }
    }
  }


  /* OTHER AREAS */

  if (
    clean(promo.location)
  ) {

    return clean(
      promo.location
    );
  }


  return "GENERAL";
}


/* ==========================================================
   LOAD PROMOTIONS
========================================================== */

async function openPromotions() {

  stopScanner();

  showScreen(
    "promotionsScreen"
  );


  if (!promotionsLoaded) {

    await loadPromotions();

  }


  renderPromotionSections();
}


async function loadPromotions() {

  const container =
    document.getElementById(
      "promotionTypes"
    );


  container.innerHTML =
    `<div class="loading">
      Loading promotions...
    </div>`;


  promotionData = {};


  try {

    const pageSize = 1000;

    let start = 0;


    while (true) {

      const end =
        start +
        pageSize -
        1;


      const {
        data,
        error
      } =
        await db
          .from("products")
          .select(
            "barcode,name,price,product_code,promo_offer"
          )
          .not(
            "promo_offer",
            "is",
            null
          )
          .neq(
            "promo_offer",
            ""
          )
          .range(
            start,
            end
          );


      if (error) {
        throw error;
      }


      if (
        !data ||
        data.length === 0
      ) {
        break;
      }


      data.forEach(
        product => {

          const promotions =
            parsePromotions(
              product.promo_offer
            );


          promotions.forEach(
            promo => {

              const section =
                promo.section;

              const location =
                promo.actualLocation;


              if (
                !promotionData[section]
              ) {

                promotionData[section] =
                  {};

              }


              if (
                !promotionData[section][
                  location
                ]
              ) {

                promotionData[section][
                  location
                ] = [];

              }


              promotionData[section][
                location
              ].push({

                product: product,

                promotion: promo

              });

            }
          );

        }
      );


      if (
        data.length <
        pageSize
      ) {
        break;
      }


      start += pageSize;
    }


    promotionsLoaded = true;


  } catch (error) {

    container.innerHTML =
      `
      <div class="error">
        Unable to load promotions.
        <br><br>
        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}
      </div>
      `;

  }
}


/* ==========================================================
   PROMOTION SECTIONS
========================================================== */

function renderPromotionSections() {

  const container =
    document.getElementById(
      "promotionTypes"
    );


  const preferredOrder = [

    "ENDS",
    "SIDES",
    "TILL ENDS",
    "TILL FRONTS",
    "FRONT OF STORE",
    "WINDOW BASKETS",
    "PROMO BAYS",
    "BULK STACKS",
    "PENCIL STACKS",
    "FSDU & STANDS",
    "DUMP BINS",
    "GIANT TIERED BASKETS",
    "CLIP STRIPS",
    "DRINKS CHILLER",
    "OTHER"

  ];


  const available =
    Object.keys(
      promotionData
    );


  const sections = [];


  preferredOrder.forEach(
    section => {

      if (
        available.includes(section)
      ) {

        sections.push(section);

      }

    }
  );


  available.forEach(
    section => {

      if (
        !sections.includes(section)
      ) {

        sections.push(section);

      }

    }
  );


  if (
    sections.length === 0
  ) {

    container.innerHTML =
      `
      <div class="empty">
        No promotional information available.
      </div>
      `;

    return;
  }


  container.innerHTML =
    sections
      .map(
        section => {

          const locations =
            promotionData[
              section
            ] || {};


          const locationNames =
            Object.keys(
              locations
            );


          const productCount =
            locationNames.reduce(
              (
                total,
                location
              ) =>
                total +
                locations[
                  location
                ].length,
              0
            );


          return `

            <div
              class="promotion-card"
              onclick="openLocations('${escapeJs(section)}')">

              <div class="promotion-icon">
                ${sectionIcon(section)}
              </div>

              <div class="promotion-text">

                <div class="promotion-name">
                  ${escapeHtml(section)}
                </div>

                <div class="promotion-sub">
                  ${locationNames.length}
                  ${
                    locationNames.length === 1
                      ? "location"
                      : "locations"
                  }
                </div>

              </div>

              <div class="count-badge">
                ${productCount} products
              </div>

            </div>

          `;

        }
      )
      .join("");
}


/* ==========================================================
   SECTION ICON
========================================================== */

function sectionIcon(section) {

  const icons = {

    "ENDS": "E",
    "SIDES": "S",
    "TILL ENDS": "TE",
    "TILL FRONTS": "TF",
    "FRONT OF STORE": "FS",
    "WINDOW BASKETS": "WB",
    "PROMO BAYS": "B",
    "BULK STACKS": "BS",
    "PENCIL STACKS": "PS",
    "FSDU & STANDS": "F",
    "DUMP BINS": "DB",
    "GIANT TIERED BASKETS": "GT",
    "CLIP STRIPS": "C",
    "DRINKS CHILLER": "DC",
    "OTHER": "O"

  };


  return icons[section] || "P";
}


/* ==========================================================
   LOCATIONS

   END 1
   END 2
   END 3
   END 10

   Correct natural order.
========================================================== */

function openLocations(section) {

  selectedPromotion =
    section;


  showScreen(
    "locationsScreen"
  );


  document.getElementById(
    "locationsTitle"
  ).textContent =
    section;


  const container =
    document.getElementById(
      "locationsList"
    );


  const locations =
    promotionData[
      section
    ] || {};


  let names =
    Object.keys(
      locations
    );


  names.sort(
    naturalSort
  );


  if (
    names.length === 0
  ) {

    container.innerHTML =
      `
      <div class="empty">
        No locations found.
      </div>
      `;

    return;
  }


  container.innerHTML =
    names
      .map(
        (
          location,
          index
        ) => {

          const count =
            locations[
              location
            ].length;


          return `

            <div
              class="location-card"
              onclick="openLocationProducts('${escapeJs(location)}')">

              <div class="location-number">
                ${getLocationNumber(
                  location,
                  index
                )}
              </div>

              <div class="location-info">

                <div class="location-name">
                  ${escapeHtml(location)}
                </div>

                <div class="location-count">
                  ${count}
                  ${
                    count === 1
                      ? "product"
                      : "products"
                  }
                </div>

              </div>

              <div class="location-arrow">
                →
              </div>

            </div>

          `;

        }
      )
      .join("");
}


/* ==========================================================
   PRODUCTS FOR LOCATION
========================================================== */

function openLocationProducts(
  location
) {

  selectedLocation =
    location;


  showScreen(
    "promoProductsScreen"
  );


  document.getElementById(
    "promoProductsTitle"
  ).textContent =
    selectedPromotion +
    " — " +
    location;


  const products =
    (
      promotionData[
        selectedPromotion
      ] || {}
    )[location] || [];


  document.getElementById(
    "promoProductsCount"
  ).textContent =
    products.length +
    (
      products.length === 1
        ? " product"
        : " products"
    );


  const container =
    document.getElementById(
      "promoProductsList"
    );


  if (
    products.length === 0
  ) {

    container.innerHTML =
      `
      <div class="empty">
        No products found for
        <strong>
          ${escapeHtml(location)}
        </strong>.
      </div>
      `;

    return;
  }


  container.innerHTML =
    products
      .map(
        (
          item,
          index
        ) =>
          buildLocationProduct(
            item,
            index
          )
      )
      .join("");
}


function backToLocations() {

  openLocations(
    selectedPromotion
  );
}


/* ==========================================================
   LOCATION PRODUCT
========================================================== */

  index
) {

  const product =

  const promo =

  let html = `

    <div class="promo-product">

      <div class="product-number">
        PRODUCT ${index + 1}
      </div>

      <div class="promo-product-name">
        ${escapeHtml(
          product.name ||
          promo.product ||
          "Unnamed product"
        )}
      </div>

      <div class="promo-product-price">
        ${formatPrice(
          product.price
        )}
      </div>

      <div class="product-info-row">
        <strong>Barcode:</strong>
        ${escapeHtml(
          product.barcode || "-"
        )}
      </div>

      <div class="product-info-row">
        <strong>Product Code:</strong>

      </div>

  ) {

      <div class="product-info-row">

  }


  const promotionalPrice =

  if (

      </div>

  }


  if (

  ) {

    html += `
      <div class="product-info-row">

          promo.offer
        )}
      </div>
    `;
  }


  if (

  ) {

    html += `
      <div class="product-info-row">
        <strong>Shelf:</strong>

          promo.shelf
        )}
      </div>

  }


  if (
    promo.comments
  ) {

    html += `
      <div class="product-info-row">
        <strong>Comments:</strong>

          promo.comments
        )}
      </div>

  }


  if (
    promo.details
  ) {

    html += `
      <div class="product-info-row">
        <strong>Details:</strong>
        ${escapeHtml(
          promo.details
        )}
      </div>
    `;
  }


  html += `
    </div>
  `;


  return html;
}

/* ==========================================================
   SORTING
========================================================== */

function naturalSort(a, b) {

  const aString =
    String(a);

  const bString =
    String(b);


  const aMatch =
    aString.match(
      /(\d+)/
    );

  const bMatch =
    bString.match(
      /(\d+)/
    );


  if (
    aMatch &&
    bMatch
  ) {

    const aNumber =
      Number(
        aMatch[1]
      );

    const bNumber =
      Number(
        bMatch[1]
      );


    if (
      aNumber !==
      bNumber
    ) {

      return (
        aNumber -
        bNumber
      );
    }
  }


  return aString.localeCompare(
    bString,
    undefined,
    {
      numeric: true,
      sensitivity: "base"
    }
  );
}


function getLocationNumber(
  location,
  index
) {

  const match =
    String(location).match(
      /(\d+)/
    );


  if (match) {
    return match[1];
  }


  return index + 1;
}


/* ==========================================================
   UTILITIES
========================================================== */

function formatPrice(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "—";
  }


  const number =
    Number(value);


  if (
    Number.isNaN(number)
  ) {

    return escapeHtml(
      String(value)
    );
  }


  return "£" +
    number.toFixed(2);
}


function clean(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(/\r/g, "")
    .trim();
}


function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }


  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}


function showError(
  elementId,
  error
) {

  document.getElementById(
    elementId
  ).innerHTML =
    `
    <div class="error">

      Something went wrong.

      <br><br>

      ${escapeHtml(
        error?.message ||
        "Unknown error"
      )}

    </div>
    `;
}
