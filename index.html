<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Beyond</title>
<meta name="theme-color" content="#0A5BA7">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="One Beyond">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#f3f4f6;
  color:#222;
  font-family:Arial,Helvetica,sans-serif
}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.screen{display:none}
.screen.active{display:block}
.app{
  max-width:900px;
  margin:0 auto;
  min-height:100vh;
  background:#f7f8fa
}
.brand-header{
  background:#0A5BA7;
  color:#fff;
  border-bottom:7px solid #FDCE0C;
  padding:18px 20px;
  text-align:center
}
.brand-name{
  font-size:40px;
  font-weight:900;
  line-height:1
}
.brand-name .one{color:#FDCE0C}
.brand-tagline{
  font-size:13px;
  font-weight:700;
  margin-top:6px
}
.home-hero{
  min-height:330px;
  background-image:
    linear-gradient(0deg,rgba(0,0,0,.68),rgba(0,0,0,.05) 70%),
    url("./onebeyond-home-hero.jpg");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:flex-end;
  padding:30px 22px
}
.hero-text{color:#fff}
.hero-text h1{
  margin:0;
  font-size:38px;
  font-weight:900
}
.hero-text p{
  margin:8px 0 0;
  font-size:18px;
  font-weight:700
}
.home-content{padding:20px}
.home-button{
  width:100%;
  min-height:76px;
  margin-bottom:14px;
  border:0;
  border-radius:18px;
  background:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.08);
  color:#0A5BA7;
  text-align:left;
  padding:16px 20px;
  font-size:21px;
  font-weight:900
}
.home-button:hover{background:#f0f5fb}
.home-button .sub{
  display:block;
  color:#777;
  font-size:13px;
  font-weight:600;
  margin-top:5px
}
.page{
  padding:18px 20px 40px
}
.page-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px
}
.back-button{
  border:0;
  background:#0A5BA7;
  color:#fff;
  border-radius:12px;
  padding:11px 15px;
  font-weight:800
}
.page-title{
  margin:0;
  color:#0A5BA7;
  font-size:28px
}
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
  margin-bottom:16px
}
.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px
}
.mode-button{
  height:58px;
  border:3px solid #d4d7dc;
  border-radius:14px;
  background:#fff;
  font-weight:800;
  color:#333
}
.mode-button.active{
  background:#0A5BA7;
  color:#fff;
  border-color:#0A5BA7
}
.search-input{
  width:100%;
  height:60px;
  border:3px solid #0A5BA7;
  border-radius:14px;
  padding:0 15px;
  font-size:19px;
  margin-bottom:12px;
  outline:0
}
.primary-button,
.scan-button,
.secondary-button{
  width:100%;
  height:60px;
  border:0;
  border-radius:14px;
  font-weight:900;
  font-size:18px;
  margin-bottom:12px
}
.primary-button{
  background:#FDCE0C;
  color:#222
}
.scan-button{
  background:#0A5BA7;
  color:#fff
}
.secondary-button{
  background:#fff;
  color:#0A5BA7;
  border:3px solid #0A5BA7
}
.scanner-box{
  display:none;
  background:#111;
  border-radius:16px;
  padding:12px;
  margin-bottom:14px
}
.scanner-box.active{display:block}
.scanner-message{
  color:#fff;
  text-align:center;
  padding:10px;
  font-size:14px
}
.scanner-reader{
  width:100%;
  overflow:hidden;
  border-radius:10px
}
.result-card,
.promo-product-card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  border-left:6px solid #0A5BA7;
  box-shadow:0 3px 12px rgba(0,0,0,.06)
}
.product-number,
.promo-number{
  font-size:12px;
  font-weight:900;
  color:#777;
  letter-spacing:.5px
}
.product-name,
.promo-product-name{
  font-size:22px;
  font-weight:900;
  margin:7px 0
}
.product-price,
.promo-product-price{
  font-size:32px;
  font-weight:900;
  color:#0A5BA7;
  margin-bottom:12px
}
.product-detail,
.promo-detail,
.promo-line{
  font-size:14px;
  line-height:1.5;
  margin-top:6px
}
.promo-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:#fff8d9;
  border:2px solid #FDCE0C
}
.promo-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:7px
}
.empty-message,
.loading{
  background:#fff;
  border-radius:16px;
  padding:22px;
  text-align:center;
  color:#666
}
.promo-section-card{
  display:flex;
  align-items:center;
  gap:15px;
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  cursor:pointer
}
.promo-number{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#0A5BA7;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  flex:none
}
.promo-section-name{
  font-size:19px;
  font-weight:900;
  color:#0A5BA7
}
.promo-section-count{
  font-size:13px;
  color:#777;
  margin-top:4px
}
.products-count{
  font-weight:800;
  color:#666;
  margin:0 0 14px
}
.id-form label{
  display:block;
  font-weight:800;
  margin:12px 0 6px
}
.id-form input{
  width:100%;
  height:52px;
  border:2px solid #ccc;
  border-radius:12px;
  padding:0 12px
}
.id-form input[type=file]{
  height:auto;
  padding:10px
}
.photo-preview{
  display:none;
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px
}
.id-result{
  display:none;
  margin-top:18px
}
.id-card{
  background:#fff;
  border:5px solid #0A5BA7;
  border-radius:22px;
  padding:18px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.1)
}
.id-card-photo{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #FDCE0C
}
.id-card-name{
  font-size:25px;
  font-weight:900;
  color:#0A5BA7;
  margin-top:12px
}
.id-card-position{
  font-size:17px;
  font-weight:700;
  margin:5px 0 14px
}
.id-card-qr{
  display:flex;
  justify-content:center
}
.footer{
  text-align:center;
  color:#888;
  font-size:12px;
  padding:10px 20px 25px
}
@media(max-width:600px){
  .brand-name{font-size:34px}
  .home-hero{min-height:300px}
  .hero-text h1{font-size:31px}
  .page{padding:15px 14px 30px}
}
</style>
</head>

<body>

<main class="app">

<section id="homeScreen" class="screen active">

  <div class="brand-header">
    <div class="brand-name">
      <span class="one">ONE</span> BEYOND
    </div>
    <div class="brand-tagline">
      Your tools. Your support. Our team.
    </div>
  </div>

  <div class="home-hero">
    <div class="hero-text">
      <h1>Welcome to ONE BEYOND</h1>
      <p>Your tools. Your support. Our team.</p>
    </div>
  </div>

  <div class="home-content">

    <button
      id="homeProductButton"
      class="home-button"
      type="button">
      Product Information
      <span class="sub">
        Check prices, promotions and product details
      </span>
    </button>

    <button
      id="promotionsButton"
      class="home-button"
      type="button">
      Promotions
      <span class="sub">
        View current promotions and offers
      </span>
    </button>

    <button
      id="incidentButton"
      class="home-button"
      type="button">
      Report an Incident
      <span class="sub">
        Report an incident through the company system
      </span>
    </button>

    <button
      id="idCardButton"
      class="home-button"
      type="button">
      My ID Card
      <span class="sub">
        Create your staff ID card
      </span>
    </button>

    <button
      id="websiteButton"
      class="home-button"
      type="button">
      Visit One Beyond Website
      <span class="sub">
        News, careers and more
      </span>
    </button>

  </div>

  <div class="footer">
    One Beyond
  </div>

</section>


<section id="productInfoScreen" class="screen">

  <div class="page">

    <div class="page-header">
      <button
        id="productHomeButton"
        class="back-button"
        type="button">
        ← Home
      </button>

      <h2 class="page-title">
        Product Information
      </h2>
    </div>

    <div class="card">

      <div class="mode-buttons">

        <button
          id="productBarcodeMode"
          class="mode-button active"
          type="button">
          Barcode
        </button>

        <button
          id="productCodeMode"
          class="mode-button"
          type="button">
          Product Code
        </button>

      </div>

      <input
        id="productSearchInput"
        class="search-input"
        type="text"
        autocomplete="off"
        placeholder="Scan or enter barcode...">

      <button
        id="productSearchButton"
        class="primary-button"
        type="button">
        Search Product
      </button>

      <button
        id="openProductScannerButton"
        class="scan-button"
        type="button">
        Scan Barcode
      </button>

      <button
        id="scanAgainButton"
        class="secondary-button"
        type="button"
        style="display:none">
        Scan Again
      </button>

      <div
        id="inlineScanner"
        class="scanner-box">

        <div
          id="productReader"
          class="scanner-reader">
        </div>

        <div
          id="inlineScannerMessage"
          class="scanner-message">
          Starting camera...
        </div>

      </div>

    </div>

    <div id="productResultContainer"></div>

  </div>

</section>


<section id="promotionSectionsScreen" class="screen">

  <div class="page">

    <div class="page-header">

      <button
        class="back-button"
        type="button"
        onclick="showScreen('homeScreen')">
        ← Home
      </button>

      <h2 class="page-title">
        Promotions
      </h2>

    </div>

    <div id="promotionSectionsContainer"></div>

  </div>

</section>


<section id="promotionLocationsScreen" class="screen">

  <div class="page">

    <div class="page-header">

      <button
        class="back-button"
        type="button"
        onclick="openPromotions()">
        ← Back
      </button>

      <h2
        id="promotionLocationsHeading"
        class="page-title">
        Locations
      </h2>

    </div>

    <div id="promotionLocationsContainer"></div>

  </div>

</section>


<section id="promotionProductsScreen" class="screen">

  <div class="page">

    <div class="page-header">

      <button
        class="back-button"
        type="button"
        onclick="openPromotionLocations(selectedPromotion)">
        ← Back
      </button>

      <h2
        id="promotionProductsHeading"
        class="page-title">
        Products
      </h2>

    </div>

    <div
      id="promotionProductsCount"
      class="products-count">
    </div>

    <div id="promotionProductsContainer"></div>

  </div>

</section>


<section id="idCardScreen" class="screen">

  <div class="page">

    <div class="page-header">

      <button
        id="idCardBackButton"
        class="back-button"
        type="button">
        ← Home
      </button>

      <h2 class="page-title">
        My ID Card
      </h2>

    </div>

    <div class="card id-form">

      <label for="idCardPhoto">
        Photo
      </label>

      <input
        id="idCardPhoto"
        type="file"
        accept="image/*"
        capture="user">

      <img
        id="idCardPhotoPreview"
        class="photo-preview"
        alt="Photo preview">

      <label for="idCardName">
        Name
      </label>

      <input
        id="idCardName"
        type="text"
        placeholder="Enter name">

      <label for="idCardPosition">
        Position
      </label>

      <input
        id="idCardPosition"
        type="text"
        placeholder="Enter position">

      <label for="idCardTillCode">
        Till Code
      </label>

      <input
        id="idCardTillCode"
        type="text"
        inputmode="numeric"
        maxlength="10"
        placeholder="Enter till code">

      <button
        id="generateIdCardButton"
        class="primary-button"
        type="button"
        style="margin-top:16px">
        Generate ID Card
      </button>

      <button
        id="resetIdCardButton"
        class="secondary-button"
        type="button">
        Reset
      </button>

    </div>

    <div
      id="idCardResult"
      class="id-result">

      <div class="id-card">

        <img
          id="generatedIdCardPhoto"
          class="id-card-photo"
          alt="ID photo">

        <div
          id="generatedIdCardName"
          class="id-card-name">
        </div>

        <div
          id="generatedIdCardPosition"
          class="id-card-position">
        </div>

        <div
          id="idCardQr"
          class="id-card-qr">
        </div>

      </div>

    </div>

  </div>

</section>

</main>


<script>

const SUPABASE_URL =
  "https://nmfjavzrxghvklkjtfaq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(
      screen => {
        screen.classList.remove(
          "active"
        );
      }
    );

  const screen =
    document.getElementById(id);

  if (screen) {
    screen.classList.add(
      "active"
    );
  }

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}


let selectedPromotion = "";


/* =========================================================
   PRODUCT INFORMATION + SEARCH
   ========================================================= */

let searchMode = "barcode";

let inlineScanner = null;

let inlineScannerRunning = false;

let inlineScannerLocked = false;


const productSearchInput =
  document.getElementById(
    "productSearchInput"
  );

const productResultContainer =
  document.getElementById(
    "productResultContainer"
  );

const inlineScannerElement =
  document.getElementById(
    "inlineScanner"
  );

const inlineScannerMessage =
  document.getElementById(
    "inlineScannerMessage"
  );

const scanAgainButton =
  document.getElementById(
    "scanAgainButton"
  );


function setProductMode(mode) {

  searchMode = mode;

  const barcodeButton =
    document.getElementById(
      "productBarcodeMode"
    );

  const codeButton =
    document.getElementById(
      "productCodeMode"
    );

  if (mode === "barcode") {

    barcodeButton.classList.add(
      "active"
    );

    codeButton.classList.remove(
      "active"
    );

    productSearchInput.placeholder =
      "Scan or enter barcode...";

  } else {

    codeButton.classList.add(
      "active"
    );

    barcodeButton.classList.remove(
      "active"
    );

    productSearchInput.placeholder =
      "Enter product code...";
  }
}


document
  .getElementById(
    "productBarcodeMode"
  )
  .addEventListener(
    "click",
    () => {

      setProductMode(
        "barcode"
      );

      productSearchInput.focus();

    }
  );


document
  .getElementById(
    "productCodeMode"
  )
  .addEventListener(
    "click",
    () => {

      setProductMode(
        "product_code"
      );

      productSearchInput.focus();

    }
  );


document
  .getElementById(
    "homeProductButton"
  )
  .addEventListener(
    "click",
    () => {

      showScreen(
        "productInfoScreen"
      );

      setProductMode(
        "barcode"
      );

      productSearchInput.focus();

    }
  );


document
  .getElementById(
    "productHomeButton"
  )
  .addEventListener(
    "click",
    async () => {

      await stopInlineScanner();

      showScreen(
        "homeScreen"
      );

    }
  );


document
  .getElementById(
    "productSearchButton"
  )
  .addEventListener(
    "click",
    () => {

      searchProduct(
        productSearchInput.value.trim(),
        searchMode
      );

    }
  );


productSearchInput
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        searchProduct(
          productSearchInput.value.trim(),
          searchMode
        );

      }

    }
  );


async function searchProduct(
  value,
  mode = "barcode"
) {

  value =
    String(
      value || ""
    ).trim();

  if (!value) {

    alert(
      mode === "barcode"
        ? "Please enter a barcode."
        : "Please enter a product code."
    );

    return;
  }


  productResultContainer.innerHTML =
    '<div class="loading">Searching...</div>';


  let query =
    supabaseClient
      .from("products")
      .select(
        "barcode,name,price,product_code,promo_offer"
      );


  if (
    mode === "barcode"
  ) {

    query =
      query.eq(
        "barcode",
        value
      );

  } else {

    query =
      query.ilike(
        "product_code",
        value
      );

  }


  const {
    data,
    error
  } =
    await query.limit(
      20
    );


  if (error) {

    productResultContainer.innerHTML =
      `
      <div class="empty-message">

        Unable to search right now.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>
      `;

    return;
  }


  if (
    !data ||
    !data.length
  ) {

    productResultContainer.innerHTML =
      '<div class="empty-message">No product found.</div>';

    return;
  }


  renderSearchResults(
    data,
    productResultContainer
  );

  scanAgainButton.style.display =
    "block";
}


function renderSearchResults(
  products,
  container =
    productResultContainer
) {

  container.innerHTML = "";


  products.forEach(
    (
      product,
      index
    ) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "result-card";


      let promoHtml =
        "";


      if (
        product.promo_offer &&
        product.promo_offer.trim()
      ) {

        promoHtml =
          renderPromoInformation(
            product.promo_offer
          );

      }


      card.innerHTML =
        `
        <div class="product-number">
          PRODUCT ${index + 1}
        </div>

        <div class="product-name">
          ${escapeHtml(
            product.name ||
            "Unnamed Product"
          )}
        </div>

        <div class="product-price">
          £${formatPrice(
            product.price
          )}
        </div>

        <div class="product-detail">
          <strong>Barcode:</strong>
          ${escapeHtml(
            product.barcode ||
            "-"
          )}
        </div>

        <div class="product-detail">
          <strong>Product Code:</strong>
          ${escapeHtml(
            product.product_code ||
            "-"
          )}
        </div>

        ${promoHtml}
        `;

      container.appendChild(
        card
      );

    }
  );
}


async function startInlineScanner() {

  await stopInlineScanner();

  inlineScannerElement.classList.add(
    "active"
  );

  inlineScannerMessage.textContent =
    "Starting camera...";

  inlineScannerLocked =
    false;

  scanAgainButton.style.display =
    "none";


  try {

    if (!inlineScanner) {

      inlineScanner =
        new Html5Qrcode(
          "productReader"
        );

    }


    await inlineScanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 160
        },
        aspectRatio:
          1.777778
      },

      async decodedText => {

        if (
          inlineScannerLocked
        ) {
          return;
        }

        inlineScannerLocked =
          true;

        inlineScannerMessage.textContent =
          "Barcode detected. Searching...";

        productSearchInput.value =
          decodedText;

        setProductMode(
          "barcode"
        );

        await stopInlineScanner();

        inlineScannerElement.classList.remove(
          "active"
        );

        await searchProduct(
          decodedText,
          "barcode"
        );

      },

      () => {}

    );


    inlineScannerRunning =
      true;

    inlineScannerMessage.textContent =
      "Point the camera at a product barcode.";

  } catch (
    error
  ) {

    console.error(
      error
    );

    inlineScannerMessage.textContent =
      "Camera could not be started. Please check camera permission.";

  }

}


async function stopInlineScanner() {

  if (
    inlineScanner &&
    inlineScannerRunning
  ) {

    try {

      await inlineScanner.stop();

    } catch (
      error
    ) {

      console.warn(
        "Scanner stop:",
        error
      );

    }

    inlineScannerRunning =
      false;

  }

}


document
  .getElementById(
    "openProductScannerButton"
  )
  .addEventListener(
    "click",
    startInlineScanner
  );

/* =========================================================
   PROMOTION PARSER
   ========================================================= */

function parsePromotions(
  promoText
) {

  if (!promoText) {
    return [];
  }


  const blocks =
    promoText
      .split(/\n+/)
      .map(
        value =>
          value.trim()
      )
      .filter(Boolean);


  const promotions = [];


  blocks.forEach(
    block => {

      const promotion = {

        plan: "",

        location: "",

        bay: "",

        categories: "",

        code: "",

        product: "",

        price: "",

        details: ""

      };


      const parts =
        block
          .split(
            /\s*\|\s*/
          )
          .map(
            value =>
              value.trim()
          )
          .filter(Boolean);


      parts.forEach(
        part => {

          const match =
            part.match(
              /^([^:]+):\s*(.*)$/
            );

          if (!match) {
            return;
          }


          const key =
            match[1]
              .trim()
              .toUpperCase();


          const value =
            match[2].trim();


          if (
            key === "PLAN"
          ) {

            promotion.plan =
              value;

          } else if (
            key === "LOCATION"
          ) {

            promotion.location =
              value;

          } else if (
            key === "BAY"
          ) {

            promotion.bay =
              value;

          } else if (
            key === "STORE CATEGORIES"
          ) {

            promotion.categories =
              value;

          } else if (
            key === "CODE"
          ) {

            promotion.code =
              value;

          } else if (
            key === "PRODUCT"
          ) {

            promotion.product =
              value;

          } else if (
            key === "PROMO PRICE"
          ) {

            promotion.price =
              value;

          } else if (
            key === "DETAILS"
          ) {

            promotion.details =
              value;

          }

        }
      );


      if (
        promotion.plan ||
        promotion.location ||
        promotion.product ||
        promotion.bay
      ) {

        promotions.push(
          promotion
        );

      }

    }
  );


  return promotions;
}


/* =========================================================
   PROMOTION SECTION
   ========================================================= */

function identifySection(
  promo
) {

  const text =
    (
      promo.plan +
      " " +
      promo.location
    )
      .toUpperCase();


  if (
    text.includes(
      "END GONDOLA"
    ) ||
    text.includes(
      "ENDS"
    )
  ) {

    return "ENDS";

  }


  if (
    text.includes(
      "SIDE GONDOLA"
    ) ||
    text.includes(
      "SIDES"
    )
  ) {

    return "SIDES";

  }


  if (
    text.includes(
      "TILL END"
    )
  ) {

    return "TILL ENDS";

  }


  if (
    text.includes(
      "TILL FRONT"
    )
  ) {

    return "TILL FRONTS";

  }


  if (
    text.includes(
      "FRONT OF STORE"
    )
  ) {

    return "FRONT OF STORE";

  }


  if (
    text.includes(
      "WINDOW BASKET"
    )
  ) {

    return "WINDOW BASKETS";

  }


  if (
    text.includes(
      "PROMO BAY"
    )
  ) {

    return "PROMO BAYS";

  }


  if (
    text.includes(
      "BULK STACK"
    )
  ) {

    return "BULK STACKS";

  }


  if (
    text.includes(
      "PENCIL STACK"
    )
  ) {

    return "PENCIL STACKS";

  }


  if (
    text.includes(
      "FSDU"
    ) ||
    text.includes(
      "STAND"
    )
  ) {

    return "FSDU & STANDS";

  }


  if (
    text.includes(
      "DUMP BIN"
    )
  ) {

    return "DUMP BINS";

  }


  if (
    text.includes(
      "GIANT TIERED"
    ) ||
    text.includes(
      "REAR HALF"
    )
  ) {

    return "GIANT TIERED BASKETS";

  }


  if (
    text.includes(
      "CLIP STRIP"
    )
  ) {

    return "CLIP STRIPS";

  }


  if (
    text.includes(
      "DRINKS CHILLER"
    )
  ) {

    return "DRINKS CHILLER";

  }


  return "OTHER";
}


/* =========================================================
   PROMOTION LOCATION
   ========================================================= */

function identifyLocation(
  promo,
  section
) {

  const values = [

    promo.location,

    promo.bay,

    promo.plan,

    promo.details

  ];


  if (
    section ===
    "PROMO BAYS"
  ) {

    const bayNumber =
      String(
        promo.bay ||
        ""
      ).trim();


    if (
      /^\d+$/.test(
        bayNumber
      )
    ) {

      return (
        "BAY " +
        bayNumber
      );

    }


    for (
      const value of values
    ) {

      const match =
        String(
          value ||
          ""
        ).match(
          /\b(?:PROMO\s*)?BAY\s*[-:#]?\s*(\d+)\b/i
        );


      if (match) {

        return (
          "BAY " +
          match[1]
        );

      }

    }

  }


  for (
    const value of values
  ) {

    const text =
      String(
        value ||
        ""
      ).trim();


    if (!text) {
      continue;
    }


    const endMatch =
      text.match(
        /\bEND\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      endMatch &&
      section === "ENDS"
    ) {

      return (
        "END " +
        endMatch[1]
      );

    }


    const sideMatch =
      text.match(
        /\bSIDE\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      sideMatch &&
      section === "SIDES"
    ) {

      return (
        "SIDE " +
        sideMatch[1]
      );

    }


    const tillEndMatch =
      text.match(
        /\bTILL\s+END\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      tillEndMatch &&
      section === "TILL ENDS"
    ) {

      return (
        "TILL END " +
        tillEndMatch[1]
      );

    }


    const tillFrontMatch =
      text.match(
        /\bTILL\s+FRONT\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      tillFrontMatch &&
      section === "TILL FRONTS"
    ) {

      return (
        "TILL FRONT " +
        tillFrontMatch[1]
      );

    }


    if (
      section === "FRONT OF STORE" ||
      section === "WINDOW BASKETS" ||
      section === "BULK STACKS" ||
      section === "PENCIL STACKS" ||
      section === "FSDU & STANDS" ||
      section === "DUMP BINS" ||
      section === "GIANT TIERED BASKETS" ||
      section === "CLIP STRIPS" ||
      section === "DRINKS CHILLER"
    ) {

      return text;

    }

  }


  return "GENERAL";
}


/* =========================================================
   PROMOTION ORDER
   ========================================================= */

const promotionSectionOrder = [

  "ENDS",

  "SIDES",

  "TILL ENDS",

  "TILL FRONTS",

  "FRONT OF STORE",

  "WINDOW BASKETS",

  "PROMO BAYS",

  "BULK STACKS",

  "PENCIL STACKS",

  "FSDU & STANDS",

  "DUMP BINS",

  "GIANT TIERED BASKETS",

  "CLIP STRIPS",

  "DRINKS CHILLER",

  "OTHER"

];


function sortSections(
  a,
  b
) {

  const ai =
    promotionSectionOrder.indexOf(
      a
    );

  const bi =
    promotionSectionOrder.indexOf(
      b
    );


  const av =
    ai === -1
      ? 999
      : ai;


  const bv =
    bi === -1
      ? 999
      : bi;


  return av - bv;
}


function naturalSort(
  a,
  b
) {

  return String(a)
    .localeCompare(
      String(b),
      undefined,
      {
        numeric:true,
        sensitivity:"base"
      }
    );
}


/* =========================================================
   LOAD PROMOTIONS
   ========================================================= */

let promotionProducts = [];

let promotionSections = {};


async function loadPromotions() {

  promotionProducts = [];

  let from = 0;

  const pageSize = 1000;


  while (true) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select(
          "barcode,name,price,product_code,promo_offer"
        )
        .not(
          "promo_offer",
          "is",
          null
        )
        .neq(
          "promo_offer",
          ""
        )
        .range(
          from,
          from +
          pageSize -
          1
        );


    if (error) {

      throw error;

    }


    if (
      !data ||
      data.length === 0
    ) {

      break;

    }


    promotionProducts.push(
      ...data
    );


    if (
      data.length <
      pageSize
    ) {

      break;

    }


    from +=
      pageSize;

  }


  buildPromotionSections();
}


function buildPromotionSections() {

  promotionSections = {};


  promotionProducts.forEach(
    product => {

      const promotions =
        parsePromotions(
          product.promo_offer
        );


      promotions.forEach(
        promo => {

          const section =
            identifySection(
              promo
            );

          const location =
            identifyLocation(
              promo,
              section
            );


          if (
            !promotionSections[
              section
            ]
          ) {

            promotionSections[
              section
            ] = {};

          }


          if (
            !promotionSections[
              section
            ][location]
          ) {

            promotionSections[
              section
            ][location] = [];

          }


          promotionSections[
            section
          ][location]
            .push({
              product,
              promo
            });

        }
      );

    }
  );
}

function renderPromotionSections() {

  const container =
    document.getElementById(
      "promotionSectionsContainer"
    );


  container.innerHTML = "";


  const sections =
    Object.keys(
      promotionSections
    )
    .sort(
      sortSections
    );


  if (
    !sections.length
  ) {

    container.innerHTML =
      '<div class="empty-message">No promotions found.</div>';

    return;

  }


  sections.forEach(
    (
      section,
      index
    ) => {

      const locations =
        promotionSections[
          section
        ];


      let count = 0;


      Object.values(
        locations
      ).forEach(
        products => {

          count +=
            products.length;

        }
      );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "promo-section-card";


      card.innerHTML =
        `
        <div class="promo-number">
          ${index + 1}
        </div>

        <div>

          <div class="promo-section-name">
            ${escapeHtml(
              section
            )}
          </div>

          <div class="promo-section-count">
            ${count.toLocaleString()}
            products
          </div>

        </div>
        `;


      card.addEventListener(
        "click",
        () => {

          openPromotionLocations(
            section
          );

        }
      );


      container.appendChild(
        card
      );

    }
  );
}

function formatPrice(
  value
) {

  const number =
    Number(value);


  if (
    !Number.isFinite(
      number
    )
  ) {

    return "0.00";

  }


  return number.toFixed(
    2
  );
}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

  const tillCode =
    idCardTillCodeInput.value.trim();


  if (
    !temporaryIdCardPhoto
  ) {

    alert(
      "Please upload a photo."
    );

    return;

  }


  if (!name) {

    alert(
      "Please enter the person's name."
    );

    return;

  }


  if (!position) {

    alert(
      "Please enter the person's position."
    );

    return;

  }


  if (
    !/^[0-9]{4,10}$/.test(
      tillCode
    )
  ) {

    alert(
      "Till Code must contain between 4 and 10 digits."
    );

    return;

  }


  if (
    typeof QRCode ===
    "undefined"
  ) {

    alert(
      "QR code generator could not be loaded. Please check your internet connection."
    );

    return;

  }


  generatedIdCardPhoto.src =
    temporaryIdCardPhoto;


  generatedIdCardName.textContent =
    name;


  generatedIdCardPosition.textContent =
    position;


  idCardQr.innerHTML =
    "";


  new QRCode(
    idCardQr,
    {
      text:
        tillCode,
      width:
        190,
      height:
        190,
      correctLevel:
        QRCode.CorrectLevel.M
    }
  );


  idCardResult.style.display =
    "block";


  setTimeout(
    () => {

      idCardResult.scrollIntoView({
        behavior:
          "smooth",
        block:
          "start"
      });

    },
    100
  );

}


document
  .getElementById(
    "resetIdCardButton"
  )
  .addEventListener(
    "click",
    resetIdCard
  );


function resetIdCard() {

  temporaryIdCardPhoto =
    "";

  idCardPhotoInput.value =
    "";

  idCardNameInput.value =
    "";

  idCardPositionInput.value =
    "";

  idCardTillCodeInput.value =
    "";

  idCardPhotoPreview.src =
    "";

  idCardPhotoPreview.style.display =
    "none";

  generatedIdCardPhoto.src =
    "";

  generatedIdCardName.textContent =
    "";

  generatedIdCardPosition.textContent =
    "";

  idCardQr.innerHTML =
    "";

  idCardResult.style.display =
    "none";

}


/* =========================================================
   INITIALISE
   ========================================================= */

showScreen(
  "homeScreen"
);

setProductMode(
  "barcode"
);

</script>
