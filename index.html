<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f1f2f4;

}

button,

}

button {

}

/* HEADER */

.header {
  background: #0A5BA7;
  color: white;

  padding: 24px 15px 24px;

}

.header-logo {

.header-subtitle {

/* APP */

.app {
  max-width: 850px;
  margin: auto;
  padding: 22px 18px 50px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* HOME */

.main-card {
  background: white;
  border-radius: 25px;
  padding: 34px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.main-heading {
  margin: 0 0 25px;
  color: #0A5BA7;
  font-size: 34px;
  font-weight: 800;
}

.main-description {
  margin-bottom: 28px;
  color: #666;
  font-size: 22px;
  line-height: 1.4;
}

.mode-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;

}

.mode-button {

  border: 4px solid #d6d6d6;

  font-size: 20px;

}

.mode-button.active {

  color: white;

}

.search-input {

.scan-button {

  height: 68px;

.promo-home-button {

  border: 4px solid #0A5BA7;
  border-radius: 17px;

}

/* RESULTS */

.result-card {

  padding: 26px;

}

.back-button {

  font-size: 18px;
  font-weight: 800;

  margin-bottom: 20px;
}

.product-name {

  font-weight: 900;
  margin-bottom: 16px;
}

.product-price {

.promo-product-card {

<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://nmfjavzrxghvklkjtfaq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dd_QRjavucCN4sG-kuFFUQ_0qfJGUsz";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   SCREENS
   ========================================================= */

const screens = [
  "homeScreen",
  "resultScreen",
  "scannerScreen",
  "promotionSectionsScreen",
  "promotionLocationsScreen",
  "promotionProductsScreen"
];

function showScreen(id) {

  screens.forEach(screenId => {

    const element =
      document.getElementById(screenId);

    if (!element) return;

    element.classList.toggle(
      "active",
      screenId === id
    );
  });

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}


/* =========================================================
   HOME MODE
   ========================================================= */

let searchMode = "barcode";


const barcodeModeButton =
  document.getElementById(
    "barcodeModeButton"
  );

const productCodeModeButton =
  document.getElementById(
    "productCodeModeButton"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );


barcodeModeButton.addEventListener(
  "click",
  () => {

    searchMode = "barcode";

    barcodeModeButton.classList.add(
      "active"
    );

    productCodeModeButton.classList.remove(
      "active"
    );

    searchInput.placeholder =
      "Enter barcode";

    searchInput.value = "";

    searchInput.focus();
  }
);


productCodeModeButton.addEventListener(
  "click",
  () => {

    searchMode = "product_code";

    productCodeModeButton.classList.add(
      "active"
    );

    barcodeModeButton.classList.remove(
      "active"
    );

    searchInput.placeholder =
      "Enter product code";

    searchInput.value = "";

    searchInput.focus();
  }
);


/* =========================================================
   SEARCH
   ========================================================= */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchProduct
  );


searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {
      searchProduct();
    }
  }
);


async function searchProduct() {

  const value =
    searchInput.value.trim();

  if (!value) {

    alert(
      searchMode === "barcode"
        ? "Please enter a barcode."
        : "Please enter a product code."
    );

    return;
  }


  showScreen("resultScreen");


  document.getElementById(
    "resultContainer"
  ).innerHTML =
    '<div class="loading">Searching...</div>';


  let query =
    supabaseClient
      .from("products")
      .select(
        "barcode,name,price,product_code,promo_offer"
      );


  if (searchMode === "barcode") {

    query =
      query.eq(
        "barcode",
        value
      );

  } else {

    query =
      query.eq(
        "product_code",
        value
      );
  }


  const {
    data,
    error
  } =
    await query.limit(20);


  if (error) {

    document.getElementById(
      "resultContainer"
    ).innerHTML = `
      <div class="empty-message">
        Unable to search right now.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || !data.length) {

    document.getElementById(
      "resultContainer"
    ).innerHTML = `
      <div class="empty-message">
        No product found.
      </div>
    `;

    return;
  }


  renderSearchResults(data);
}


/* =========================================================
   SEARCH RESULT RENDER
   ========================================================= */

function renderSearchResults(products) {

  const container =
    document.getElementById(
      "resultContainer"
    );

  container.innerHTML = "";


  products.forEach(product => {

    const card =
      document.createElement("div");

    card.className =
      "result-card";


    let promoHtml = "";


    if (
      product.promo_offer &&
      product.promo_offer.trim()
    ) {

      promoHtml =
        renderPromoInformation(
          product.promo_offer
        );
    }


    card.innerHTML = `

      <div class="product-name">
        ${escapeHtml(
          product.name ||
          "Unnamed Product"
        )}
      </div>

      <div class="product-price">
        £${formatPrice(product.price)}
      </div>

      <div class="product-detail">
        <strong>Barcode:</strong>
        ${escapeHtml(
          product.barcode || "-"
        )}
      </div>

      <div class="product-detail">
        <strong>Product Code:</strong>
        ${escapeHtml(
          product.product_code || "-"
        )}
      </div>

      ${promoHtml}

    `;


    container.appendChild(card);
  });
}


/* =========================================================
   PROMOTION PARSER
   ========================================================= */

function parsePromotions(promoText) {

  if (!promoText) {
    return [];
  }


  const blocks =
    promoText
      .split(/\n+/)
      .map(
        value => value.trim()
      )
      .filter(Boolean);


  const promotions = [];


  blocks.forEach(block => {

    const promotion = {

      plan: "",
      location: "",
      bay: "",
      categories: "",
      code: "",
      product: "",
      price: "",
      details: ""
    };


    const parts =
      block
        .split(/\s*\|\s*/)
        .map(
          value => value.trim()
        )
        .filter(Boolean);


    parts.forEach(part => {

      const match =
        part.match(
          /^([^:]+):\s*(.*)$/
        );


      if (!match) return;


      const key =
        match[1]
          .trim()
          .toUpperCase();

      const value =
        match[2].trim();


      if (
        key === "PLAN"
      ) {
        promotion.plan = value;

      } else if (
        key === "LOCATION"
      ) {
        promotion.location = value;

      } else if (
        key === "BAY"
      ) {
        promotion.bay = value;

      } else if (
        key === "STORE CATEGORIES"
      ) {
        promotion.categories = value;

      } else if (
        key === "CODE"
      ) {
        promotion.code = value;

      } else if (
        key === "PRODUCT"
      ) {
        promotion.product = value;

      } else if (
        key === "PROMO PRICE"
      ) {
        promotion.price = value;

      } else if (
        key === "DETAILS"
      ) {
        promotion.details = value;
      }

    });


    if (
      promotion.plan ||
      promotion.location ||
      promotion.product ||
      promotion.bay
    ) {
      promotions.push(
        promotion
      );
    }

  });


  return promotions;
}


/* =========================================================
   PROMOTION SECTION
   ========================================================= */

function identifySection(promo) {

  const text =
    (
      promo.plan +
      " " +
      promo.location
    )
      .toUpperCase();


  if (
    text.includes("END GONDOLA") ||
    text.includes("ENDS")
  ) {
    return "ENDS";
  }


  if (
    text.includes("SIDE GONDOLA") ||
    text.includes("SIDES")
  ) {
    return "SIDES";
  }


  if (
    text.includes("TILL END")
  ) {
    return "TILL ENDS";
  }


  if (
    text.includes("TILL FRONT")
  ) {
    return "TILL FRONTS";
  }


  if (
    text.includes("FRONT OF STORE")
  ) {
    return "FRONT OF STORE";
  }


  if (
    text.includes("WINDOW BASKET")
  ) {
    return "WINDOW BASKETS";
  }


  if (
    text.includes("PROMO BAY")
  ) {
    return "PROMO BAYS";
  }


  if (
    text.includes("BULK STACK")
  ) {
    return "BULK STACKS";
  }


  if (
    text.includes("PENCIL STACK")
  ) {
    return "PENCIL STACKS";
  }


  if (
    text.includes("FSDU") ||
    text.includes("STAND")
  ) {
    return "FSDU & STANDS";
  }


  if (
    text.includes("DUMP BIN")
  ) {
    return "DUMP BINS";
  }


  if (
    text.includes("GIANT TIERED") ||
    text.includes("REAR HALF")
  ) {
    return "GIANT TIERED BASKETS";
  }


  if (
    text.includes("CLIP STRIP")
  ) {
    return "CLIP STRIPS";
  }


  if (
    text.includes("DRINKS CHILLER")
  ) {
    return "DRINKS CHILLER";
  }


  return "OTHER";
}


/* =========================================================
   PROMOTION LOCATION
   ========================================================= */

function identifyLocation(
  promo,
  section
) {

  const values = [

    promo.location,
    promo.bay,
    promo.plan,
    promo.details
  ];


  /*
    PROMO BAYS FIX

    The Admin page now stores:

    BAY: 1
    BAY: 2
    BAY: 3

    Therefore the app can directly turn that
    into BAY 1 / BAY 2 / BAY 3.
  */

  if (
    section === "PROMO BAYS"
  ) {

    const bayNumber =
      String(
        promo.bay || ""
      ).trim();


    if (
      /^\d+$/.test(
        bayNumber
      )
    ) {

      return (
        "BAY " +
        bayNumber
      );
    }


    for (
      const value of values
    ) {

      const match =
        String(value || "")
          .match(
            /\b(?:PROMO\s*)?BAY\s*[-:#]?\s*(\d+)\b/i
          );


      if (match) {

        return (
          "BAY " +
          match[1]
        );
      }
    }
  }


  for (
    const value of values
  ) {

    const text =
      String(
        value || ""
      ).trim();


    if (!text) continue;


    const endMatch =
      text.match(
        /\bEND\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      endMatch &&
      section === "ENDS"
    ) {

      return (
        "END " +
        endMatch[1]
      );
    }


    const sideMatch =
      text.match(
        /\bSIDE\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      sideMatch &&
      section === "SIDES"
    ) {

      return (
        "SIDE " +
        sideMatch[1]
      );
    }


    const tillEndMatch =
      text.match(
        /\bTILL\s+END\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      tillEndMatch &&
      section === "TILL ENDS"
    ) {

      return (
        "TILL END " +
        tillEndMatch[1]
      );
    }


    const tillFrontMatch =
      text.match(
        /\bTILL\s+FRONT\s*[-:#]?\s*(\d+)\b/i
      );


    if (
      tillFrontMatch &&
      section === "TILL FRONTS"
    ) {

      return (
        "TILL FRONT " +
        tillFrontMatch[1]
      );
    }


    if (
      section === "FRONT OF STORE" ||
      section === "WINDOW BASKETS" ||
      section === "BULK STACKS" ||
      section === "PENCIL STACKS" ||
      section === "FSDU & STANDS" ||
      section === "DUMP BINS" ||
      section === "GIANT TIERED BASKETS" ||
      section === "CLIP STRIPS" ||
      section === "DRINKS CHILLER"
    ) {

      return text;
    }

  }


  return "GENERAL";
}


/* =========================================================
   PROMOTION ORDER
   ========================================================= */

const promotionSectionOrder = [

  "ENDS",
  "SIDES",
  "TILL ENDS",
  "TILL FRONTS",
  "FRONT OF STORE",
  "WINDOW BASKETS",
  "PROMO BAYS",
  "BULK STACKS",
  "PENCIL STACKS",
  "FSDU & STANDS",
  "DUMP BINS",
  "GIANT TIERED BASKETS",
  "CLIP STRIPS",
  "DRINKS CHILLER",
  "OTHER"

];


function sortSections(a, b) {

  const ai =
    promotionSectionOrder.indexOf(a);

  const bi =
    promotionSectionOrder.indexOf(b);


  const av =
    ai === -1
      ? 999
      : ai;

  const bv =
    bi === -1
      ? 999
      : bi;


  return av - bv;
}


/* =========================================================
   NATURAL SORT
   ========================================================= */

function naturalSort(a, b) {

  return String(a)
    .localeCompare(
      String(b),
      undefined,
      {
        numeric: true,
        sensitivity: "base"
      }
    );
}


/* =========================================================
   LOAD PROMOTIONS
   ========================================================= */

let promotionProducts = [];
let promotionSections = {};


async function loadPromotions() {

  promotionProducts = [];


  let from = 0;

  const pageSize = 1000;


  while (true) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select(
          "barcode,name,price,product_code,promo_offer"
        )
        .not(
          "promo_offer",
          "is",
          null
        )
        .neq(
          "promo_offer",
          ""
        )
        .range(
          from,
          from + pageSize - 1
        );


    if (error) {
      throw error;
    }


    if (
      !data ||
      data.length === 0
    ) {
      break;
    }


    promotionProducts.push(
      ...data
    );


    if (
      data.length < pageSize
    ) {
      break;
    }


    from += pageSize;
  }


  buildPromotionSections();
}


/* =========================================================
   BUILD PROMOTION SECTIONS
   ========================================================= */

function buildPromotionSections() {

  promotionSections = {};


  promotionProducts.forEach(product => {

    const promotions =
      parsePromotions(
        product.promo_offer
      );


    promotions.forEach(promo => {

      const section =
        identifySection(
          promo
        );


      const location =
        identifyLocation(
          promo,
          section
        );


      if (
        !promotionSections[section]
      ) {

        promotionSections[section] =
          {};
      }


      if (
        !promotionSections[section][location]
      ) {

        promotionSections[section][location] =
          [];
      }


      promotionSections[section][location]
        .push({

          product,
          promo

        });

    });

  });
}


/* =========================================================
   PROMOTION SECTION SCREEN
   ========================================================= */

async function openPromotions() {

  showScreen(
    "promotionSectionsScreen"
  );


  const container =
    document.getElementById(
      "promotionSectionsContainer"
    );


  container.innerHTML =
    '<div class="loading">Loading promotions...</div>';


  try {

    await loadPromotions();

    renderPromotionSections();

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty-message">
        Unable to load promotions.<br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}


function renderPromotionSections() {

  const container =
    document.getElementById(
      "promotionSectionsContainer"
    );


  container.innerHTML = "";


  const sections =
    Object.keys(
      promotionSections
    ).sort(
      sortSections
    );


  if (!sections.length) {

    container.innerHTML =
      '<div class="empty-message">No promotions found.</div>';

    return;
  }


  sections.forEach(
    (section, index) => {

      const locations =
        promotionSections[
          section
        ];


      let count = 0;

      Object.values(
        locations
      ).forEach(
        products => {
          count += products.length;
        }
      );


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "promo-section-card";


      card.innerHTML = `

        <div class="promo-number">
          ${index + 1}
        </div>

        <div>

          <div class="promo-section-name">
            ${escapeHtml(section)}
          </div>

          <div class="promo-section-count">
            ${count.toLocaleString()} products
          </div>

        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          openPromotionLocations(
            section
          );

        }
      );


      container.appendChild(
        card
      );

    }
  );
}


/* =========================================================
   PROMOTION LOCATIONS
   ========================================================= */

  }

        "promo-section-card";


      card.innerHTML = `

          <div class="promo-section-name">
            ${escapeHtml(location)}
          </div>

          <div class="promo-section-count">

/* =========================================================
   PROMOTION PRODUCTS
   ========================================================= */

function openPromotionProducts(
  section,
  location
) {

  showScreen(
    "promotionProductsScreen"
  );


  document.getElementById(
    "promotionProductsHeading"
  ).textContent =
    section +
    " — " +

  ).textContent =
    products.length.toLocaleString() +

    );


  container.innerHTML = "";


  if (!products.length) {

    container.innerHTML =
      '<div class="empty-message">No products found.</div>';

    return;
  }


  /*
    Number products exactly as requested:
    Product 1
    Product 2
    Product 3
    ...
  */

  products.forEach(
    (item, index) => {

      const product =
        item.product;

      const promo =
        item.promo;


      const card =
        document.createElement(
          "div"
        );

      card.className =
        "promo-product-card";


      let detailsHtml = "";


      if (promo.categories) {

        detailsHtml += `
          <div class="promo-detail">
            <strong>Store Categories:</strong>
            ${escapeHtml(
              promo.categories
            )}
          </div>
        `;
      }


      if (promo.price) {

        detailsHtml += `
          <div class="promo-detail">
            <strong>Promotional Price:</strong>
            ${escapeHtml(
              promo.price
            )}
          </div>
        `;
      }


      if (promo.code) {

        detailsHtml += `
          <div class="promo-detail">
            <strong>Product Code:</strong>
            ${escapeHtml(
              promo.code
            )}
          </div>
        `;
      }


      if (product.barcode) {

        detailsHtml += `
          <div class="promo-detail">
            <strong>Barcode:</strong>
            ${escapeHtml(
              product.barcode
            )}
          </div>
        `;
      }


      if (
        promo.bay &&
        section === "PROMO BAYS"
      ) {

        detailsHtml += `
          <div class="promo-detail">
            <strong>Bay:</strong>
            ${escapeHtml(
              promo.bay
            )}
          </div>
        `;
      }


      if (promo.details) {

        detailsHtml += `
          <div class="promo-detail">
            <strong>Comments:</strong>
            ${escapeHtml(
              promo.details
            )}
          </div>
        `;
      }


      card.innerHTML = `

        <div class="product-number">
          PRODUCT ${index + 1}
        </div>

        <div class="promo-product-name">
          ${escapeHtml(
            product.name ||
            promo.product ||
            "Unnamed Product"
          )}
        </div>

        <div class="promo-product-price">
          £${formatPrice(
            product.price
          )}
        </div>

        ${detailsHtml}

      `;


      container.appendChild(
        card
      );

    }
  );
}

/* =========================================================
   SCANNER
   ========================================================= */

let scanner = null;
let scannerRunning = false;
let scannerLocked = false;


document
  .getElementById(
    "scanButton"
  )
  .addEventListener(
    "click",
    startScanner
  );


async function startScanner() {

  showScreen(
    "scannerScreen"
  );


  document.getElementById(
    "scannerMessage"
  ).textContent =
    "Starting camera...";


  scannerLocked = false;


  try {

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          "reader"
        );
    }


    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 160
        },
        aspectRatio: 1.777778
      },

      decodedText => {

        if (
          scannerLocked
        ) {
          return;
        }


        scannerLocked = true;


        document.getElementById(
          "scannerMessage"
        ).textContent =
          "Barcode detected. Searching...";


        searchInput.value =
          decodedText;


        searchMode =
          "barcode";


        barcodeModeButton.classList.add(
          "active"
        );

        productCodeModeButton.classList.remove(
          "active"
        );


        stopScanner()
          .finally(
            () => {
              searchProduct();
            }
          );

      },

      errorMessage => {

        /*
          html5-qrcode sends many normal
          "not found" messages while scanning.
          They are deliberately ignored.
        */

      }

    );


    scannerRunning = true;


    document.getElementById(
      "scannerMessage"
    ).textContent =
      "Point the camera at a product barcode.";

  } catch (error) {

    console.error(error);

    document.getElementById(
      "scannerMessage"
    ).textContent =
      "Camera could not be started. Please check camera permission.";

  }
}


async function stopScanner() {

  if (
    scanner &&
    scannerRunning
  ) {

    try {

      await scanner.stop();

    } catch (error) {

      console.warn(
        "Scanner stop:",
        error
      );
    }


    scannerRunning = false;
  }
}


/* =========================================================
   HELPERS
   ========================================================= */

function formatPrice(value) {

  const number =
    Number(value);


  if (
    !Number.isFinite(number)
  ) {

    return "0.00";
  }


  return number.toFixed(2);
}


function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

) {

    return "";

  let html =

    '<div class="promo-title">Promotion</div>';


  promotions.forEach(

      if (promo.plan) {

        html += `

            ${escapeHtml(
              promo.plan
            )}
          </div>
        `;
      }


      if (promo.location) {

        html += `
          <div class="promo-line">
            <strong>Location:</strong>
            ${escapeHtml(
              promo.location
            )}
          </div>
        `;
      }


      if (promo.bay) {

        html += `
          <div class="promo-line">
            <strong>Bay:</strong>
            ${escapeHtml(
              promo.bay
            )}
          </div>
        `;
      }


      if (promo.categories) {

        html += `
          <div class="promo-line">
            <strong>Store Categories:</strong>
            ${escapeHtml(
              promo.categories
            )}
          </div>
        `;
      }


      if (promo.price) {

        html += `
          <div class="promo-line">
            <strong>Promo Price:</strong>
            ${escapeHtml(
              promo.price
            )}
          </div>
        `;
      }


      if (promo.details) {

        html += `
          <div class="promo-line">
            <strong>Details:</strong>
            ${escapeHtml(
              promo.details
            )}
          </div>
        `;
      }

    }
  );


  html +=
    "</div>";


  return html;
}
